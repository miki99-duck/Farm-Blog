# ============================================================
#  星露谷农场日志 · Jekyll 配置
#  GitHub Pages 会用内建 Jekyll 按这份配置自动构建站点
# ============================================================

title: 星露谷农场日志
description: 种地、钓鱼、写代码 —— 记录星露谷里的每一天，也记录屏幕外的小事。
lang: zh-CN

# GitHub Pages 默认就是 kramdown，这里显式写死，防止以后默认值变化
markdown: kramdown

kramdown:
  input: GFM              # 表格 / 围栏代码块 / 删除线 按 GitHub 方言解析
  syntax_highlighter: rouge
  auto_ids: true          # 给标题生成 id，右侧目录靠它跳转
  hard_wrap: false

# 刻意不配置 theme，也不配置 defaults。
#
# 为什么不用 defaults 给所有 .md 套 layout：
#   defaults 的 scope 只能按路径前缀过滤，没法只匹配 .md，
#   index.html 会被一起套上 layout，而它本身已经是完整 HTML 文档，
#   再包一层 <html> 会把博客首页拆坏。
#
# 所以规则是：每个文档在开头写 5 行 front matter（见 kafka.md）。
#   GitHub Pages 默认启用了 jekyll-optional-front-matter 和 jekyll-default-layout，
#   裸 .md 通常也能渲染，但那取决于 GitHub 那边的默认插件集，不受本仓库控制；
#   写 front matter 才是确定能渲染的路子，而且 title / description
#   会被 _layouts/default.html 用来生成 <title> 和 meta description。
#
# 注意：文档里如果出现 {{ 或 {%（比如 Prometheus 告警模板里的 {{ $labels.instance }}），
#   必须用 {% raw %} ... {% endraw %} 包起来，否则 Liquid 会把它当变量解析。
#   kafka.md 里已有两处这样的包裹。
