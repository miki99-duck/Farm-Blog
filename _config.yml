# ============================================================
#  星露谷农场日志 · Jekyll 配置
#  GitHub Pages 用内建 Jekyll（jekyll 3.10.0）按这份配置构建站点
# ============================================================

title: 星露谷农场日志
description: 种地、钓鱼、写代码 —— 记录星露谷里的每一天，也记录屏幕外的小事。
lang: zh-CN

# ============================================================
#  SEO 配置（部署前替换 url / baseurl / author / twitter_handle 为实际值）
# ============================================================
url: "https://miki99.github.io"       # 站点根 URL，不带路径
baseurl: "/farmblog"                   # 站点路径前缀，根路径写 ""
author: "Miki99"
author_url: "https://github.com/miki99"
twitter_handle: "@miki99"
og_image: "/assets/og-image.svg"       # 社交分享卡片图
keywords:
  - 星露谷物语
  - 游戏博客
  - 技术笔记
  - 微服务
  - Java
  - Spring Boot
  - 程序员日记

# GitHub Pages 默认就是 kramdown，这里显式写死，防止以后默认值变化
markdown: kramdown

kramdown:
  input: GFM              # 表格 / 围栏代码块 / 删除线 按 GitHub 方言解析
  syntax_highlighter: rouge
  auto_ids: true          # 给标题生成 id，文档页左侧目录靠它跳转
  hard_wrap: false

# ============================================================
#  新增一篇文档要做什么
# ============================================================
# 1) 把 .md 放进任意文件夹（文件夹只是组织文件用，不会显示在页面上）
# 2) push。完事。
#
# 不需要写任何 front matter。下面这些全是可选项：
#
#   ---
#   layout: default          # 不写会自动套 _layouts/default.html
#   title: "标题"             # 不写会自动取正文第一个 # 标题
#   date: 2024-10-15         # 不写就排在列表最后、按文件名升序。不要加引号
#   tags: [微服务]            # 决定它属于哪个「农作物」，见下
#   summary: "一句话摘要"     # 不写就截取正文前 110 字
#   listed: false            # 写了就不出现在首页列表（页面本身仍可访问）
#   ---
#
# ---- 首页列表 ----
# 由 index.html 里的 Liquid 生成：遍历 site.pages，按「有 date 的日期倒序，
# 没 date 的按文件名升序排最后」。不按文件夹分组，也不显示分类名。
# 分页是前端做的（每页 10 条，见 index.html 里的 PER_PAGE）。
# 为什么要前端分页：GitHub Pages 的 jekyll-paginate 只支持 _posts 里的文章，
# 对 site.pages 无效；jekyll-paginate-v2 不在 GitHub Pages 白名单里，用了会构建失败。
#
# ---- 侧栏「农作物」 ----
# 每个农作物 = 一个标签。成熟度（几度）= 带该标签的文章数，由页面脚本实时统计。
# 想加一个新农作物，就在 index.html 的 .crops 里加一个按钮：
#   <button type="button" class="crop" data-crop="新名字" aria-pressed="false">…</button>
# 然后在文档 front matter 里写 tags: [新名字] 即可，不用改别的地方。
# 条宽按最大的农作物线性归一化，最少 8% 以保证只有 1 度的也看得见。
#
# ---- 哪些目录不参与列表 ----
# 这些顶层目录名会被跳过（防止资源目录里的 .md 混进文档列表）：
#   assets / images / html_backup / node_modules / vendor / _layouts / _site / .git
# 要临时排除单篇文档，用 front matter 的 listed: false。
#
# ---- 文档里的图片 ----
# 用标准 markdown 写法，路径相对文档所在文件夹：
#   ![图 1-1：Gateway 整体架构](images/01-gw-arch.svg)
# jekyll-relative-links 会把它改写成带 baseurl 的绝对路径，不用自己处理。
#
# 但新画的 SVG 必须带命名空间，否则浏览器用 <img> 加载时渲染成空白
# （内联进 HTML 时不需要，所以很容易在编辑器预览里看着正常、上线却是空白）：
#   <svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
# 自查：Select-String -Path images\*.svg -Pattern '<svg' |
#         Where-Object { $_.Line -notmatch 'xmlns' }
#
# ---- date 为什么不能加引号 ----
# YAML 里裸写的 2024-10-15 解析成 Date 对象，加了引号就变成字符串。
# Jekyll 的 sort 用 <=> 比较，两者混在一起会抛异常，直接导致整站构建失败。
# 要么全部不加引号，要么全部加，别混。
#
# ---- 为什么首页列表刻意不用 where 过滤器 ----
# Jekyll 3.10 的 where 会按 input.hash 记忆化结果：
#     @where_filter_cache[input_id][property][value] ||= ...
# 而 jekyll-optional-front-matter 是在渲染期把没有 front matter 的 .md
# concat 进 site.pages 的，两者叠加会让 where 返回不完整的结果 ——
# 实测 21 篇文档用 `where: "layout","default"` 只筛出 4 篇。
# 所以改成显式 for 循环。以后改这块模板时不要换回 where。
#
# ---- 分类名为什么曾经取 page.path 而不是 page.dir ----
# （现在已经不显示分类了，但这条以后可能还会用到）
# Page#dir 是从（已编码的）url 派生的：
#     def dir; url.end_with?("/") ? url : ...; end
# 所以中文文件夹会变成 %E6%8A%80%E6%9C%AF，页面上就是乱码。
# page.path 走的是 relative_path（拼接原始的 @dir），还是「技术」。
#
# ---- 别在仓库根目录放 README.md ----
# jekyll-readme-index 会试图把根目录的 README.md 变成 index.html，和现有首页冲突。
#
# ============================================================
#  唯一需要人工注意的坑：{{ 和 {%
# ============================================================
# 文档里如果出现 {{ 或 {%（例如 Prometheus 告警模板里的 {{ $labels.instance }}），
# 必须用 {% raw %} ... {% endraw %} 包起来，否则 Liquid 会把它当变量解析，
# 轻则内容被吞，重则整站构建失败。
#
# GitHub Pages 用的是 jekyll 3.10.0，不支持 Jekyll 4 的 render_with_liquid: false，
# 所以只能用 {% raw %}。技术/kafka.md 里已有两处这样的包裹。
#
# 推之前自查：
#   Select-String -Path *.md -Pattern '\{\{|\{%'
