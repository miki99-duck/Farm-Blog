  <text x="600" y="220" font-family="Press Start 2P, monospace" font-size="28" fill="#2e1a0c" text-anchor="middle" font-weight="bold">星露谷农场日志</text>
  <text x="600" y="250" font-family="Press Start 2P, monospace" font-size="12" fill="#4a2c17" text-anchor="middle">STARDEW VALLEY FARM BLOG</text>
  <!-- 底部描述 -->
  <rect x="300" y="480" width="600" height="60" rx="6" fill="#2e1a0c" opacity="0.85"/>
  <text x="600" y="518" font-family="sans-serif" font-size="18" fill="#f8e8c0" text-anchor="middle">种地 · 钓鱼 · 写代码 —— 记录星露谷里的每一天</text>
  <!-- 底部链接 -->
  <text x="600" y="580" font-family="monospace" font-size="14" fill="#fff6dd" text-anchor="middle" opacity="0.7">miki99.github.io/farmblog</text>
