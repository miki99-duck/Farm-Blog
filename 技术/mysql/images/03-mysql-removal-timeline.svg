<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <rect x="0" y="0" width="880" height="360" fill="#0d1117"/>
  <defs>
    <marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <!-- 标题 -->
  <text x="22" y="36" fill="#e6edf3" font-size="15" font-weight="bold">9.x 的「移除」都在 9.7.0 一次性落地</text>
  <text x="22" y="58" fill="#8b949e" font-size="11.5">因为 LTS 规则：只有某条线的第一个 LTS 才允许移除功能</text>
  <!-- 创新版：可以随时移除 -->
  <line x1="70" y1="92" x2="690" y2="92" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="380" y="84" fill="#58a6ff" font-size="11" text-anchor="middle">9.0 ~ 9.6 是 Innovation：加功能、也移除功能</text>
  <!-- 时间轴 -->
  <line x1="70" y1="210" x2="700" y2="210" stroke="#8b949e" stroke-width="2"/>
  <circle cx="95" cy="210" r="6" fill="#1c2129" stroke="#58a6ff" stroke-width="2"/>
  <text x="95" y="232" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">9.0</text>
  <circle cx="195" cy="210" r="6" fill="#1c2129" stroke="#58a6ff" stroke-width="2"/>
  <text x="195" y="232" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">9.1</text>
  <circle cx="295" cy="210" r="6" fill="#1c2129" stroke="#58a6ff" stroke-width="2"/>
  <text x="295" y="232" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">9.2</text>
  <circle cx="395" cy="210" r="6" fill="#1c2129" stroke="#58a6ff" stroke-width="2"/>
  <text x="395" y="232" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">9.3</text>
  <circle cx="495" cy="210" r="6" fill="#1c2129" stroke="#58a6ff" stroke-width="2"/>
  <text x="495" y="232" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">9.4</text>
  <circle cx="595" cy="210" r="6" fill="#1c2129" stroke="#58a6ff" stroke-width="2"/>
  <text x="595" y="232" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">9.5</text>
  <circle cx="695" cy="210" r="6" fill="#1c2129" stroke="#58a6ff" stroke-width="2"/>
  <text x="695" y="232" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">9.6</text>
  <text x="95" y="150" fill="#f0883e" font-size="10" text-anchor="middle">mysql_native_</text>
  <text x="95" y="166" fill="#f0883e" font-size="10" text-anchor="middle">password 移除</text>
  <line x1="95" y1="174" x2="95" y2="202" stroke="#f0883e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="395" y="150" fill="#f0883e" font-size="10" text-anchor="middle">innodb_log_</text>
  <text x="395" y="166" fill="#f0883e" font-size="10" text-anchor="middle">file_size 移除</text>
  <line x1="395" y1="174" x2="395" y2="202" stroke="#f0883e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="495" y="150" fill="#f0883e" font-size="10" text-anchor="middle">temptable_</text>
  <text x="495" y="166" fill="#f0883e" font-size="10" text-anchor="middle">use_mmap 移除</text>
  <line x1="495" y1="174" x2="495" y2="202" stroke="#f0883e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="595" y="150" fill="#f0883e" font-size="10" text-anchor="middle">半同步别名</text>
  <text x="595" y="166" fill="#f0883e" font-size="10" text-anchor="middle">默认值翻转</text>
  <line x1="595" y1="174" x2="595" y2="202" stroke="#f0883e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="695" y="150" fill="#f0883e" font-size="10" text-anchor="middle">MD5/SHA1</text>
  <text x="695" y="166" fill="#f0883e" font-size="10" text-anchor="middle">移入组件</text>
  <line x1="695" y1="174" x2="695" y2="202" stroke="#f0883e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="295" y="190" fill="#f0883e" font-size="10" text-anchor="middle">FLUSH PRIVILEGES 弃用</text>
  <!-- 9.7 LTS：全部生效 -->
  <line x1="706" y1="210" x2="740" y2="210" stroke="#f85149" stroke-width="2" marker-end="url(#ar0)"/>
  <text x="723.0" y="203.0" fill="#f85149" font-size="10.5" text-anchor="middle">集中生效</text>
  <rect x="744" y="120" width="118" height="180" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="803.0" y="189.75" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">9.7.0</text>
  <text x="803.0" y="202.625" fill="#8b949e" font-size="10.5" text-anchor="middle">LTS</text>
  <text x="803.0" y="217.125" fill="#8b949e" font-size="10.5" text-anchor="middle">2026-04-21</text>
  <text x="803.0" y="231.625" fill="#8b949e" font-size="10.5" text-anchor="middle">移除项：无</text>
  <!-- 结论 -->
  <text x="22" y="286" fill="#f85149" font-size="11.5">→ 升级 8.4 → 9.7 时，上面每一条都会一次性生效：这是 9.x 唯一的「破坏窗口」。</text>
  <text x="22" y="310" fill="#8b949e" font-size="11.5">→ 进入 9.7 LTS 之后，9.7.1 / 9.7.2 只做修复，不再移除（官方逐条列表写「none」）。</text>
  <text x="22" y="334" fill="#8b949e" font-size="11">注意：官方「What Is New in MySQL 9.7」页把 9.5 删掉的两个变量写成 9.7 移除，以 release notes 为准。</text>
</svg>
