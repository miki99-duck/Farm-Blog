<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect x="0" y="0" width="880" height="470" fill="#0d1117"/>
  <defs>
    <marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <!-- 标题 -->
  <text x="22" y="36" fill="#e6edf3" font-size="15" font-weight="bold">MySQL VECTOR 的真实边界：能存、能读，但社区版不能检索</text>
  <text x="22" y="58" fill="#8b949e" font-size="11.5">VECTOR 是定长浮点列，不是一个可用的向量数据库</text>
  <!-- 存储 -->
  <rect x="22" y="78" width="280" height="250" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="32" y="102" fill="#58a6ff" font-size="12.5" font-weight="bold">存储：VECTOR(N)</text>
  <text x="32" y="130" fill="#e6edf3" font-size="11">· 每个元素 4 字节单精度浮点</text>
  <text x="32" y="154" fill="#e6edf3" font-size="11">· 默认 2048 维 / 最大 16383 维</text>
  <text x="32" y="178" fill="#e6edf3" font-size="11">· 裸写 VECTOR = 默认长度</text>
  <text x="32" y="202" fill="#e6edf3" font-size="11">· 只能与另一个 VECTOR 比相等</text>
  <text x="32" y="226" fill="#e6edf3" font-size="11">· 不能做主键 / 外键 / 唯一键 / 分区键</text>
  <text x="32" y="250" fill="#e6edf3" font-size="11">· 不能作为直方图来源</text>
  <text x="32" y="274" fill="#e6edf3" font-size="11">· 只有 InnoDB 支持；NDB 不支持</text>
  <text x="32" y="298" fill="#e6edf3" font-size="11">· 文本化上限 262128 字节</text>
  <!-- 函数 -->
  <rect x="320" y="78" width="250" height="250" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="330" y="102" fill="#bc8cff" font-size="12.5" font-weight="bold">函数</text>
  <text x="330" y="132" fill="#3fb950" font-size="10.5">· STRING_TO_VECTOR / TO_VECTOR</text>
  <text x="330" y="162" fill="#3fb950" font-size="10.5">· VECTOR_TO_STRING / FROM_VECTOR</text>
  <text x="330" y="192" fill="#3fb950" font-size="10.5">· VECTOR_DIM</text>
  <text x="330" y="222" fill="#f85149" font-size="10.5">· DISTANCE / VECTOR_DISTANCE</text>
  <text x="330" y="254" fill="#f85149" font-size="10.5">注意：距离函数只对 OCI 上的</text>
  <text x="330" y="272" fill="#f85149" font-size="10.5">HeatWave / MySQL AI 提供，</text>
  <text x="330" y="290" fill="#f85149" font-size="10.5">不含商业版与社区版发行包</text>
  <!-- 两条路 -->
  <rect x="590" y="78" width="268" height="112" rx="8" fill="#1c2129" stroke="#f85149" stroke-width="1.5"/>
  <text x="724.0" y="121.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Community / Commercial</text>
  <text x="724.0" y="133.875" fill="#8b949e" font-size="10.5" text-anchor="middle">没有任何向量索引（VECTOR 列不可索引）</text>
  <text x="724.0" y="148.375" fill="#8b949e" font-size="10.5" text-anchor="middle">也没有官方距离函数 → 只能取回应用层算</text>
  <rect x="590" y="216" width="268" height="112" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="724.0" y="259.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">HeatWave / MySQL AI</text>
  <text x="724.0" y="271.875" fill="#8b949e" font-size="10.5" text-anchor="middle">9.5.0 起自动建 HNSW 向量索引</text>
  <text x="724.0" y="286.375" fill="#8b949e" font-size="10.5" text-anchor="middle">rapid_auto_vector_index_* 等参数</text>
  <text x="590" y="346" fill="#8b949e" font-size="10">索引元数据：rpd_vector_indexes</text>
  <line x1="724" y1="196" x2="724" y2="212" stroke="#8b949e" stroke-width="2" marker-end="url(#ar0)"/>
  <text x="736" y="208" fill="#8b949e" font-size="10">要做 ANN 只有这条路</text>
  <!-- 结论 -->
  <text x="22" y="366" fill="#e6edf3" font-size="13" font-weight="bold">结论：社区版的 VECTOR 是「定长浮点列」，不是向量数据库。</text>
  <text x="22" y="396" fill="#8b949e" font-size="11">· 想用 SQL 存向量、按主键读写：可以，但相似度要在应用层算（全表扫）。</text>
  <text x="22" y="418" fill="#8b949e" font-size="11">· 想要 ANN 索引：HeatWave 侧有 HNSW；PostgreSQL 侧 pgvector 有 HNSW/IVFFlat（以其官方文档为准）。</text>
  <text x="22" y="440" fill="#8b949e" font-size="11">· 常被追问的「MySQL vs pgvector」：本文只对 MySQL 侧给出官方出处。</text>
</svg>
