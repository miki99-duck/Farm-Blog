<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="592" viewBox="0 0 920 592" xml:space="preserve">
  <rect x="0" y="0" width="920" height="592" fill="#0d1117"/>
  <defs>
    <marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <!-- 标题 -->
  <text x="460.0" y="30" fill="#e6edf3" font-size="15.5" font-weight="bold" text-anchor="middle">notify 唤醒之后到底发生了什么：WAITING → BLOCKED → RUNNABLE</text>
  <text x="460.0" y="52" fill="#8b949e" font-size="11" text-anchor="middle">ObjectMonitor 的 _WaitSet / _EntryList 就是这两个状态的物理位置</text>
  <!-- 对象与监视器 -->
  <rect x="30" y="84" width="180" height="76" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="120.0" y="115.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">对象 obj</text>
  <text x="120.0" y="129.25" fill="#8b949e" font-size="10" text-anchor="middle">Mark Word 指向 Monitor</text>
  <line x1="214" y1="122" x2="250" y2="122" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#ar1)"/>
  <rect x="254" y="78" width="610" height="138" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="268" y="100" fill="#a371f7" font-size="12" font-weight="bold">ObjectMonitor（重量级锁的实体）</text>
  <text x="268" y="120" fill="#3fb950" font-size="10.5" font-weight="bold">Owner</text>
  <text x="360" y="120" fill="#8b949e" font-size="10.5">当前持有监视器的线程（谁在 synchronized 里）</text>
  <text x="268" y="144" fill="#8b949e" font-size="10.5" font-weight="bold">_cxq</text>
  <text x="360" y="144" fill="#8b949e" font-size="10.5">刚来抢锁、还没排上队的线程（也表现为 BLOCKED）</text>
  <text x="268" y="168" fill="#f85149" font-size="10.5" font-weight="bold">_EntryList</text>
  <text x="360" y="168" fill="#8b949e" font-size="10.5">候选队列：notify 挪过来的 + 排队等锁的 → BLOCKED</text>
  <text x="268" y="192" fill="#d29922" font-size="10.5" font-weight="bold">_WaitSet</text>
  <text x="360" y="192" fill="#8b949e" font-size="10.5">调用过 wait() 的线程 → WAITING / TIMED_WAITING</text>
  <!-- 三步唤醒 -->
  <rect x="30" y="246" width="268" height="96" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="164.0" y="271.86" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">① t1：wait()</text>
  <text x="164.0" y="285.86" fill="#8b949e" font-size="10" text-anchor="middle">持锁时调用</text>
  <text x="164.0" y="300.86" fill="#8b949e" font-size="10" text-anchor="middle">释放监视器，进 _WaitSet</text>
  <text x="164.0" y="315.86" fill="#8b949e" font-size="10" text-anchor="middle">状态 → WAITING</text>
  <line x1="302" y1="294" x2="322" y2="294" stroke="#d29922" stroke-width="1.8" marker-end="url(#ar2)"/>
  <rect x="326" y="246" width="268" height="96" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="460.0" y="271.86" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">② t2：notify()</text>
  <text x="460.0" y="285.86" fill="#8b949e" font-size="10" text-anchor="middle">t2 自己还持着锁</text>
  <text x="460.0" y="300.86" fill="#8b949e" font-size="10" text-anchor="middle">_WaitSet 里挪一个到 _EntryList</text>
  <text x="460.0" y="315.86" fill="#8b949e" font-size="10" text-anchor="middle">t1 状态 → BLOCKED ★</text>
  <line x1="598" y1="294" x2="618" y2="294" stroke="#f85149" stroke-width="1.8" marker-end="url(#ar3)"/>
  <rect x="622" y="246" width="268" height="96" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="756.0" y="271.86" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">③ t2 退出</text>
  <text x="756.0" y="285.86" fill="#8b949e" font-size="10" text-anchor="middle">释放监视器</text>
  <text x="756.0" y="300.86" fill="#8b949e" font-size="10" text-anchor="middle">t1 抢到 → 状态 RUNNABLE</text>
  <text x="756.0" y="315.86" fill="#8b949e" font-size="10" text-anchor="middle">（抢不到就继续 BLOCKED）</text>
  <!-- 状态条 -->
  <text x="30" y="380" fill="#e6edf3" font-size="11.5" font-weight="bold">t1 的一生（本机实测跑出来的顺序）：</text>
  <rect x="30" y="396" width="168" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="114.0" y="422.36" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">RUNNABLE</text>
  <text x="114" y="466" fill="#8b949e" font-size="9.5" text-anchor="middle">第 1 步</text>
  <line x1="204" y1="422" x2="318" y2="422" stroke="#3fb950" stroke-width="1.8" marker-end="url(#ar0)"/>
  <text x="261" y="413" fill="#3fb950" font-size="10.5" text-anchor="middle">wait()</text>
  <rect x="250" y="396" width="168" height="52" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="334.0" y="422.36" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">WAITING</text>
  <text x="334" y="466" fill="#8b949e" font-size="9.5" text-anchor="middle">第 2 步</text>
  <line x1="424" y1="422" x2="538" y2="422" stroke="#d29922" stroke-width="1.8" marker-end="url(#ar2)"/>
  <text x="481" y="413" fill="#d29922" font-size="10.5" text-anchor="middle">notify()</text>
  <rect x="470" y="396" width="168" height="52" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="554.0" y="422.36" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">BLOCKED</text>
  <text x="554" y="466" fill="#8b949e" font-size="9.5" text-anchor="middle">第 3 步</text>
  <line x1="644" y1="422" x2="758" y2="422" stroke="#f85149" stroke-width="1.8" marker-end="url(#ar3)"/>
  <text x="701" y="413" fill="#f85149" font-size="10.5" text-anchor="middle">抢到锁</text>
  <rect x="690" y="396" width="168" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="774.0" y="422.36" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">RUNNABLE</text>
  <text x="774" y="466" fill="#8b949e" font-size="9.5" text-anchor="middle">第 4 步</text>
  <text x="30" y="496" fill="#d29922" font-size="11">实测：主线程持锁调用 notify() 之后立刻读 t1.getState() → BLOCKED（不是 RUNNABLE）；主线程退出 synchronized 后才变 RUNNABLE</text>
  <text x="30" y="518" fill="#8b949e" font-size="11">所以「notify 把线程唤醒」只完成了一半：信号出去了，锁还没拿到。这也是 wait 必须写在 while 循环里的原因</text>
  <text x="30" y="546" fill="#8b949e" font-size="11">对照：LockSupport.unpark() 唤醒的 park 不需要抢监视器锁 → WAITING 直接回 RUNNABLE（图上没有 BLOCKED 这一跳）</text>
  <text x="30" y="568" fill="#8b949e" font-size="11">join() 同理：内部是 synchronized(this){ while (isAlive()) wait(0); }，线程退出时 JVM 在 Thread 对象上 notifyAll → 唤醒者也要重抢锁</text>
</svg>
