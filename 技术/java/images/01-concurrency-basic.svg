<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- 左：单线程 -->
  <rect x="20" y="20" width="420" height="290" rx="10" fill="rgba(139,148,158,.06)" stroke="#8b949e"/>
  <text x="230" y="48" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">① 单线程：串行执行</text>

  <rect x="45" y="72" width="180" height="34" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="135" y="93" text-anchor="middle" fill="#d29922" font-size="11">任务A（3s）</text>
  <rect x="45" y="120" width="120" height="34" rx="6" fill="#161b22" stroke="#a371f7"/>
  <text x="105" y="141" text-anchor="middle" fill="#a371f7" font-size="11">任务B（2s）</text>
  <rect x="45" y="168" width="90" height="34" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <text x="90" y="189" text-anchor="middle" fill="#58a6ff" font-size="11">任务C（1s）</text>

  <line x1="45" y1="225" x2="225" y2="225" stroke="#8b949e" stroke-width="1.5"/>
  <text x="240" y="229" fill="#8b949e" font-size="10.5">时间 →</text>
  <text x="135" y="252" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">总耗时 6s</text>
  <text x="230" y="284" text-anchor="middle" fill="#8b949e" font-size="10.5">CPU 一次只做一个事，前面的没做完后面的不能开始</text>

  <!-- 右：多线程 -->
  <rect x="480" y="20" width="420" height="290" rx="10" fill="rgba(63,185,80,.06)" stroke="#3fb950"/>
  <text x="690" y="48" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">② 多线程：并行执行</text>

  <text x="505" y="80" fill="#d29922" font-size="10.5">T1</text>
  <rect x="530" y="68" width="180" height="24" rx="5" fill="#161b22" stroke="#d29922"/>
  <text x="620" y="84" text-anchor="middle" fill="#d29922" font-size="10.5">任务A（3s）</text>

  <text x="505" y="112" fill="#a371f7" font-size="10.5">T2</text>
  <rect x="530" y="100" width="120" height="24" rx="5" fill="#161b22" stroke="#a371f7"/>
  <text x="590" y="116" text-anchor="middle" fill="#a371f7" font-size="10.5">任务B（2s）</text>

  <text x="505" y="144" fill="#58a6ff" font-size="10.5">T3</text>
  <rect x="530" y="132" width="60" height="24" rx="5" fill="#161b22" stroke="#58a6ff"/>
  <text x="560" y="148" text-anchor="middle" fill="#58a6ff" font-size="10.5">C（1s）</text>

  <line x1="530" y1="225" x2="710" y2="225" stroke="#3fb950" stroke-width="1.5"/>
  <text x="725" y="229" fill="#3fb950" font-size="10.5">时间 →</text>
  <text x="620" y="252" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">总耗时 3s（约省一半）</text>

  <!-- 底部：核心前提 -->
  <rect x="45" y="262" width="0" height="0" fill="none"/>
  <text x="230" y="284" fill="#8b949e" font-size="10.5"></text>
  <text x="690" y="284" text-anchor="middle" fill="#8b949e" font-size="10.5">前提：多核 CPU；共享数据要加锁（第3、4章）</text>
</svg>
