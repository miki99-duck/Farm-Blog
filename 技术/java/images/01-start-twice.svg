<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="636" viewBox="0 0 920 636" xml:space="preserve">
  <rect x="0" y="0" width="920" height="636" fill="#0d1117"/>
  <defs>
    <marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <!-- 标题 -->
  <text x="460.0" y="30" fill="#e6edf3" font-size="15.5" font-weight="bold" text-anchor="middle">start() 为什么只能调一次：一个 int 字段决定的事</text>
  <text x="460.0" y="52" fill="#8b949e" font-size="11" text-anchor="middle">JDK 8 与 JDK 17 的 start() 实现几乎一样（本机 javap 验证过：public synchronized void start()）</text>
  <!-- 源码 -->
  <rect x="30" y="76" width="470" height="250" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="44" y="98" fill="#58a6ff" font-size="12" font-weight="bold">java.lang.Thread#start()</text>
  <text x="44" y="122.0" fill="#8b949e" font-size="9.6">private volatile int threadStatus;       // 0 = NEW，其它值全是 VM 写的</text>
  <text x="44" y="133.2" fill="#8b949e" font-size="9.6"></text>
  <text x="44" y="144.4" fill="#8b949e" font-size="9.6">public synchronized void start() {</text>
  <text x="44" y="155.6" fill="#e6edf3" font-size="9.6">    if (threadStatus != 0)               // ← 检查的不是「是否活着」</text>
  <text x="44" y="166.8" fill="#8b949e" font-size="9.6">        throw new IllegalThreadStateException();</text>
  <text x="44" y="178.0" fill="#8b949e" font-size="9.6">    group.add(this);                     // 线程组记账</text>
  <text x="44" y="189.2" fill="#8b949e" font-size="9.6">    boolean started = false;</text>
  <text x="44" y="200.39999999999998" fill="#8b949e" font-size="9.6">    try {</text>
  <text x="44" y="211.6" fill="#8b949e" font-size="9.6">        start0();                        // native：真正去创建 OS 线程</text>
  <text x="44" y="222.8" fill="#8b949e" font-size="9.6">        started = true;</text>
  <text x="44" y="234.0" fill="#8b949e" font-size="9.6">    } finally {</text>
  <text x="44" y="245.2" fill="#8b949e" font-size="9.6">        if (!started) group.threadStartFailed(this);   // 失败要回滚</text>
  <text x="44" y="256.4" fill="#8b949e" font-size="9.6">    }</text>
  <text x="44" y="267.6" fill="#8b949e" font-size="9.6">}</text>
  <text x="44" y="278.79999999999995" fill="#8b949e" font-size="9.6">private native void start0();</text>
  <!-- 生命周期上的判定点 -->
  <rect x="520" y="76" width="370" height="80" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="705.0" y="108.61" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">NEW：threadStatus = 0</text>
  <text x="705.0" y="122.61" fill="#8b949e" font-size="10.5" text-anchor="middle">唯一允许 start() 的状态</text>
  <rect x="520" y="176" width="370" height="116" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="705.0" y="211.11" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">非 0：RUNNABLE / WAITING / BLOCKED / TERMINATED</text>
  <text x="705.0" y="225.11" fill="#8b949e" font-size="10.5" text-anchor="middle">再 start() → IllegalThreadStateException</text>
  <text x="705.0" y="240.61" fill="#8b949e" font-size="10.5" text-anchor="middle">跑完的线程也一样：Thread 对象是一次性的</text>
  <text x="705.0" y="256.11" fill="#8b949e" font-size="10.5" text-anchor="middle">想复用「任务」：复用 Runnable，或交给线程池</text>
  <line x1="705" y1="160" x2="705" y2="172" stroke="#f85149" stroke-width="1.8" marker-end="url(#ar0)"/>
  <!-- 为什么必须在 start 里同步 -->
  <rect x="30" y="348" width="860" height="78" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="40" y="370" fill="#e6edf3" font-size="12" font-weight="bold">synchronized 保的是「检查 + native 启动」这一整段的原子性</text>
  <text x="40" y="384.0" fill="#8b949e" font-size="10.5">两个线程同时 start 同一个 Thread：monitor 让它们串行进来，第二个看到的 threadStatus 已经非 0 → 只有一个成功</text>
  <text x="40" y="399.5" fill="#8b949e" font-size="10.5">threadStatus 虽然是 volatile，但「检查后立刻用它」这个复合动作只有加锁才能整体原子</text>
  <!-- 容易记混的三件事（本机实测） -->
  <rect x="30" y="442" width="860" height="166" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1.5"/>
  <text x="44" y="464" fill="#d29922" font-size="11.5" font-weight="bold">start() vs run()</text>
  <text x="44" y="482" fill="#8b949e" font-size="10.5">调 run() 只是普通方法调用：run() 里 currentThread() 是调用者，被调的 Thread 对象状态一直是 NEW</text>
  <text x="44" y="498" fill="#8b949e" font-size="10.5">实测：run() 跑完后 t.getState() = NEW，isAlive() = false</text>
  <text x="44" y="514" fill="#d29922" font-size="11.5" font-weight="bold">start() vs setDaemon()</text>
  <text x="44" y="532" fill="#8b949e" font-size="10.5">start() 看 threadStatus；setDaemon() 看 isAlive() —— 两个不同的判断依据</text>
  <text x="44" y="548" fill="#8b949e" font-size="10.5">实测：start 之后 setDaemon 抛 IllegalThreadStateException；线程 TERMINATED 之后再 setDaemon 不抛（isAlive()=false）</text>
  <text x="44" y="564" fill="#d29922" font-size="11.5" font-weight="bold">start() 之后状态是什么</text>
  <text x="44" y="582" fill="#8b949e" font-size="10.5">不保证：实测 5000 次「start() 返回后立刻检查」，run() 一行都还没跑（5000/5000）</text>
  <text x="44" y="598" fill="#8b949e" font-size="10.5">主线程只要多走 3000 次加法，同一份代码就能观察到 TERMINATED</text>
</svg>
