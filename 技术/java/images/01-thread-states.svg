<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="460" y="30" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Thread 六状态模型（java.lang.Thread.State）</text>
  <text x="460" y="50" text-anchor="middle" fill="#8b949e" font-size="11">new Thread 后还没 start() = NEW，永远进不了 RUNNABLE</text>

  <!-- NEW -->
  <rect x="30" y="110" width="150" height="56" rx="8" fill="rgba(139,148,158,.10)" stroke="#8b949e"/>
  <text x="105" y="134" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">NEW 新建</text>
  <text x="105" y="152" text-anchor="middle" fill="#8b949e" font-size="10">new Thread()</text>

  <!-- RUNNABLE -->
  <rect x="250" y="110" width="170" height="56" rx="8" fill="rgba(63,185,80,.12)" stroke="#3fb950"/>
  <text x="335" y="134" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">RUNNABLE 可运行</text>
  <text x="335" y="152" text-anchor="middle" fill="#8b949e" font-size="10">已 start，等 CPU 或正在跑</text>

  <!-- BLOCKED -->
  <rect x="500" y="70" width="170" height="50" rx="8" fill="rgba(248,81,73,.10)" stroke="#f85149"/>
  <text x="585" y="90" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">BLOCKED 阻塞</text>
  <text x="585" y="107" text-anchor="middle" fill="#8b949e" font-size="10">抢 synchronized 锁失败</text>

  <!-- WAITING -->
  <rect x="500" y="140" width="170" height="50" rx="8" fill="rgba(210,153,34,.10)" stroke="#d29922"/>
  <text x="585" y="160" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">WAITING 等待</text>
  <text x="585" y="177" text-anchor="middle" fill="#8b949e" font-size="10">wait() / join() 无限期</text>

  <!-- TIMED_WAITING -->
  <rect x="500" y="210" width="170" height="50" rx="8" fill="rgba(210,153,34,.10)" stroke="#d29922"/>
  <text x="585" y="230" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">TIMED_WAITING</text>
  <text x="585" y="247" text-anchor="middle" fill="#8b949e" font-size="10">sleep(n) / wait(n) 有时限</text>

  <!-- TERMINATED -->
  <rect x="740" y="140" width="150" height="50" rx="8" fill="rgba(139,148,158,.10)" stroke="#8b949e"/>
  <text x="815" y="160" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">TERMINATED 终止</text>
  <text x="815" y="177" text-anchor="middle" fill="#8b949e" font-size="10">run() 执行完毕</text>

  <!-- 箭头 -->
  <line x1="180" y1="138" x2="248" y2="138" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="214" y="130" text-anchor="middle" fill="#8b949e" font-size="10">start()</text>

  <line x1="420" y1="120" x2="498" y2="96" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="140" x2="498" y2="163" stroke="#d29922" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="156" x2="498" y2="233" stroke="#d29922" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 三个状态回到 RUNNABLE -->
  <line x1="585" y1="120" x2="470" y2="164" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="585" y1="190" x2="470" y2="164" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="585" y1="260" x2="470" y2="164" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="475" y="292" fill="#3fb950" font-size="10.5">→ 回到 RUNNABLE：抢到锁 / notify / 时间到</text>

  <line x1="420" y1="158" x2="738" y2="164" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="580" y="285" fill="#8b949e" font-size="10.5">run() 结束 → TERMINATED（终态，不能复活）</text>

  <!-- 底部速查 -->
  <rect x="30" y="318" width="860" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="46" y="337" fill="#58a6ff" font-size="11" font-weight="bold">速查：</text>
  <text x="98" y="337" fill="#e6edf3" font-size="11">sleep → TIMED_WAITING ｜ join → WAITING ｜ wait() → WAITING ｜ wait(n) → TIMED_WAITING ｜ synchronized 没抢到锁 → BLOCKED</text>
  <text x="46" y="355" fill="#8b949e" font-size="10.5">注意：start() 之后不能调 sleep 前的逻辑；RUNNABLE 里既包括"等待 CPU 时间片"也包括"正在执行"</text>
</svg>
