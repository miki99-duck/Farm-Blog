<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">线程安全三大问题（共享可变数据 + 多线程）</text>

  <!-- ① 原子性 -->
  <rect x="20" y="50" width="285" height="290" rx="10" fill="rgba(248,81,73,.05)" stroke="#f85149"/>
  <text x="162" y="76" text-anchor="middle" fill="#f85149" font-size="13" font-weight="bold">① 原子性：指令被"插队"</text>

  <text x="40" y="104" fill="#d29922" font-size="10.5">线程A（读 i=5）</text>
  <text x="40" y="130" fill="#a371f7" font-size="10.5">线程B（读 i=5）</text>

  <rect x="40" y="142" width="80" height="24" rx="5" fill="#161b22" stroke="#d29922"/>
  <text x="80" y="158" text-anchor="middle" fill="#d29922" font-size="10">i++ → 6</text>
  <rect x="40" y="174" width="80" height="24" rx="5" fill="#161b22" stroke="#a371f7"/>
  <text x="80" y="190" text-anchor="middle" fill="#a371f7" font-size="10">i++ → 6</text>

  <line x1="120" y1="154" x2="150" y2="154" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="120" y1="186" x2="150" y2="186" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="152" y="142" width="135" height="56" rx="6" fill="#161b22" stroke="#8b949e"/>
  <text x="219" y="163" text-anchor="middle" fill="#e6edf3" font-size="10">i++ 不是一条指令</text>
  <text x="219" y="181" text-anchor="middle" fill="#8b949e" font-size="9.5">读 → 加1 → 写回</text>

  <text x="162" y="228" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">期望 7，实际 6</text>
  <text x="162" y="252" text-anchor="middle" fill="#8b949e" font-size="10">两条执行链互相覆盖（丢失更新）</text>
  <text x="162" y="282" text-anchor="middle" fill="#3fb950" font-size="10.5">解：synchronized / volatile 不解决 / AtomicInteger</text>
  <text x="162" y="310" text-anchor="middle" fill="#8b949e" font-size="9.5">volatile 只保证可见性和有序性，不保证原子性</text>

  <!-- ② 可见性 -->
  <rect x="325" y="50" width="285" height="290" rx="10" fill="rgba(210,153,34,.05)" stroke="#d29922"/>
  <text x="467" y="76" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">② 可见性：改了别人看不到</text>

  <rect x="345" y="98" width="100" height="52" rx="6" fill="#161b22" stroke="#d29922"/>
  <text x="395" y="120" text-anchor="middle" fill="#d29922" font-size="11" font-weight="bold">线程A</text>
  <text x="395" y="138" text-anchor="middle" fill="#8b949e" font-size="9.5">flag = true</text>
  <text x="395" y="152" text-anchor="middle" fill="#8b949e" font-size="9.5">（写进自己的缓存）</text>

  <rect x="465" y="98" width="130" height="52" rx="6" fill="#161b22" stroke="#8b949e"/>
  <text x="530" y="120" text-anchor="middle" fill="#e6edf3" font-size="11">共享变量</text>
  <text x="530" y="138" text-anchor="middle" fill="#8b949e" font-size="9.5">CPU 缓存 / 主内存</text>
  <text x="530" y="152" text-anchor="middle" fill="#8b949e" font-size="9.5">（未刷回，未失效）</text>

  <rect x="465" y="176" width="130" height="52" rx="6" fill="#161b22" stroke="#a371f7"/>
  <text x="530" y="198" text-anchor="middle" fill="#a371f7" font-size="11" font-weight="bold">线程B</text>
  <text x="530" y="216" text-anchor="middle" fill="#a371f7" font-size="9.5">读到的还是 false</text>

  <text x="467" y="262" text-anchor="middle" fill="#f85149" font-size="11">while (!flag) {} → 死循环</text>
  <text x="467" y="288" text-anchor="middle" fill="#3fb950" font-size="10.5">解：volatile（可见性 + 有序性）/ 加锁</text>
  <text x="467" y="310" text-anchor="middle" fill="#8b949e" font-size="9.5">volatile 写后立刻刷回主内存，读前强制从主内存读</text>

  <!-- ③ 有序性 -->
  <rect x="630" y="50" width="270" height="290" rx="10" fill="rgba(88,166,255,.05)" stroke="#58a6ff"/>
  <text x="765" y="76" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">③ 有序性：指令被"重排"</text>

  <rect x="655" y="96" width="220" height="26" rx="5" fill="#161b22" stroke="#58a6ff"/>
  <text x="765" y="113" text-anchor="middle" fill="#58a6ff" font-size="10">代码：1. init()  2. initialized = true</text>

  <rect x="655" y="140" width="100" height="24" rx="5" fill="#161b22" stroke="#f85149"/>
  <text x="705" y="156" text-anchor="middle" fill="#f85149" font-size="10">initialized=true</text>
  <rect x="775" y="140" width="100" height="24" rx="5" fill="#161b22" stroke="#f85149"/>
  <text x="825" y="156" text-anchor="middle" fill="#f85149" font-size="10">init()</text>
  <text x="765" y="180" text-anchor="middle" fill="#f85149" font-size="10.5">编译器/JIT 可能重排 → 别人读到 true 时还没初始化</text>

  <text x="765" y="216" text-anchor="middle" fill="#8b949e" font-size="9.5">三种优化都会重排：</text>
  <text x="765" y="236" text-anchor="middle" fill="#8b949e" font-size="9.5">1 CPU 指令级并行（乱序执行）</text>
  <text x="765" y="256" text-anchor="middle" fill="#8b949e" font-size="9.5">2 编译器指令优化</text>
  <text x="765" y="276" text-anchor="middle" fill="#8b949e" font-size="9.5">3 内存系统缓冲（写缓冲、缓存一致性）</text>

  <text x="765" y="310" text-anchor="middle" fill="#3fb950" font-size="10.5">解：volatile（happens-before 禁重排）/ synchronized</text>

  <!-- 底部结论 -->
  <rect x="20" y="358" width="880" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="378" fill="#58a6ff" font-size="11" font-weight="bold">核心结论：</text>
  <text x="110" y="378" fill="#e6edf3" font-size="11">单线程下三大问题都不存在（程序员假设的内存模型）；一旦多线程 + 共享可变数据，必须用工具治理。</text>
  <text x="36" y="397" fill="#8b949e" font-size="10.5">volatile 解决 ②③；synchronized / ReentrantLock / 原子类解决 ①②③。不要"为了安全"乱加锁——锁是有成本的（第4章）。</text>
</svg>
