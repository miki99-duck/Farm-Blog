<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
        </marker>
      </defs>
      <!-- 提供者 -->
      <rect x="30" y="110" width="150" height="70" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
      <text x="105" y="140" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">服务提供者</text>
      <text x="105" y="160" text-anchor="middle" fill="#8b949e" font-size="11">order-service :8081</text>
      <!-- 消费者 -->
      <rect x="30" y="40" width="150" height="50" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="105" y="62" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">服务消费者</text>
      <text x="105" y="80" text-anchor="middle" fill="#8b949e" font-size="11">user-service :8082</text>
      <!-- Nacos 集群 -->
      <rect x="360" y="100" width="180" height="100" rx="10" fill="rgba(88,166,255,.08)" stroke="#58a6ff" stroke-width="2"/>
      <text x="450" y="130" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Nacos 注册中心</text>
      <text x="450" y="152" text-anchor="middle" fill="#e6edf3" font-size="11.5">服务注册表</text>
      <text x="450" y="170" text-anchor="middle" fill="#8b949e" font-size="10.5">Distro（AP）临时实例</text>
      <text x="450" y="186" text-anchor="middle" fill="#8b949e" font-size="10.5">JRaft（CP）持久实例</text>
      <!-- 调用目标 -->
      <rect x="680" y="110" width="160" height="70" rx="8" fill="#1c2129" stroke="#d29922" stroke-width="1.5"/>
      <text x="760" y="140" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">实例 A / 实例 B</text>
      <text x="760" y="160" text-anchor="middle" fill="#8b949e" font-size="11">192.168.1.10:8081</text>
      <text x="760" y="176" text-anchor="middle" fill="#8b949e" font-size="11">192.168.1.11:8081</text>
      <!-- 流程标注 -->
      <text x="200" y="80" fill="#3fb950" font-size="11.5">① 注册 + 心跳</text>
      <text x="200" y="140" fill="#58a6ff" font-size="11.5">② 拉取列表 + 订阅</text>
      <text x="200" y="165" fill="#bc8cff" font-size="11.5">③ 变更推送（gRPC 双向流）</text>
      <text x="560" y="140" fill="#d29922" font-size="11.5">④ 负载均衡选择</text>
      <text x="560" y="165" fill="#d29922" font-size="11.5">⑤ HTTP 调用</text>
      <!-- 箭头 -->
      <line x1="180" y1="150" x2="355" y2="140" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="180" y1="75" x2="355" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="450" y1="100" x2="450" y2="88" stroke="#bc8cff" stroke-width="2"/>
      <line x1="450" y1="88" x2="190" y2="88" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4 3"/>
      <line x1="190" y1="88" x2="190" y2="93" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="540" y1="150" x2="675" y2="140" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="105" y1="90" x2="105" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
      <text x="112" y="102" fill="#8b949e" font-size="10">调用</text>
    </svg>