<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- 应用 -->
  <rect x="20" y="30" width="200" height="90" rx="8" fill="rgba(63,185,80,.06)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="120" y="55" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">业务应用（多服务）</text>
  <text x="120" y="75" text-anchor="middle" fill="#e6edf3" font-size="10.5">网关 / order / user ...</text>
  <text x="120" y="93" text-anchor="middle" fill="#e6edf3" font-size="10.5">日志：JSON + traceId</text>
  <text x="120" y="111" text-anchor="middle" fill="#8b949e" font-size="9.5">写入本地 /var/log/app.log</text>
  <!-- Filebeat -->
  <rect x="280" y="30" width="150" height="90" rx="8" fill="rgba(216,150,34,.06)" stroke="#d29922" stroke-width="1.5"/>
  <text x="355" y="58" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">Filebeat 采集</text>
  <text x="355" y="78" text-anchor="middle" fill="#e6edf3" font-size="10.5">轻量 Agent，tail 日志文件</text>
  <text x="355" y="94" text-anchor="middle" fill="#e6edf3" font-size="10.5">增量采集，记录读取位置</text>
  <text x="355" y="110" text-anchor="middle" fill="#8b949e" font-size="9.5">内存占用小（几 MB）</text>
  <!-- Logstash -->
  <rect x="490" y="30" width="160" height="90" rx="8" fill="rgba(188,140,255,.06)" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="570" y="58" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">Logstash 处理</text>
  <text x="570" y="78" text-anchor="middle" fill="#e6edf3" font-size="10.5">解析、清洗、字段提取</text>
  <text x="570" y="94" text-anchor="middle" fill="#e6edf3" font-size="10.5">可省略（Filebeat 直连 ES）</text>
  <text x="570" y="110" text-anchor="middle" fill="#8b949e" font-size="9.5">重，Java/内存大</text>
  <!-- ES -->
  <rect x="710" y="30" width="150" height="90" rx="8" fill="rgba(88,166,255,.07)" stroke="#58a6ff" stroke-width="2"/>
  <text x="785" y="58" text-anchor="middle" fill="#58a6ff" font-size="13.5" font-weight="bold">Elasticsearch</text>
  <text x="785" y="78" text-anchor="middle" fill="#e6edf3" font-size="10.5">存储 + 倒排索引检索</text>
  <text x="785" y="94" text-anchor="middle" fill="#e6edf3" font-size="10.5">按天分索引</text>
  <text x="785" y="110" text-anchor="middle" fill="#8b949e" font-size="9.5">app-log-2026.09.19</text>
  <!-- Kibana -->
  <rect x="710" y="180" width="150" height="80" rx="8" fill="rgba(240,101,149,.06)" stroke="#e66594" stroke-width="1.5"/>
  <text x="785" y="208" text-anchor="middle" fill="#e66594" font-size="13.5" font-weight="bold">Kibana</text>
  <text x="785" y="228" text-anchor="middle" fill="#e6edf3" font-size="10.5">搜索、看板、告警</text>
  <text x="785" y="246" text-anchor="middle" fill="#8b949e" font-size="9.5">浏览器访问 5601</text>
  <!-- 箭头 -->
  <line x1="220" y1="75" x2="275" y2="75" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="75" x2="485" y2="75" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="650" y1="75" x2="705" y2="75" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="785" y1="120" x2="785" y2="175" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 底部 -->
  <text x="440" y="250" text-anchor="middle" fill="#8b949e" font-size="11">面试说清楚：应用打印 JSON 日志 → Filebeat 增量采集 → （Logstash 可选清洗）→ ES 按天索引 → Kibana 查询/看板</text>
  <text x="440" y="278" text-anchor="middle" fill="#3fb950" font-size="11">排障链路：Kibana 按 traceId 搜一条链 → 全服务日志拼成时间线（配合 08 篇 SkyWalking）</text>
</svg>