<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- 分片广播 -->
  <rect x="40" y="40" width="800" height="105" rx="10" fill="rgba(88,166,255,.06)" stroke="#58a6ff" stroke-dasharray="6 4"/>
  <text x="440" y="65" text-anchor="middle" fill="#58a6ff" font-size="13.5" font-weight="bold">分片广播路由：所有执行器都执行，但每个只处理自己的分片</text>
  <text x="440" y="88" text-anchor="middle" fill="#8b949e" font-size="11">场景：每天凌晨把 1000 万条设备数据归档到历史表——单台要跑几个小时</text>
  <text x="440" y="108" text-anchor="middle" fill="#e6edf3" font-size="11">参数：shardIndex（第几片）+ shardTotal（共几片）→ SQL：WHERE id % 3 = 0/1/2</text>
  <!-- 三个执行器分片 -->
  <rect x="60" y="165" width="220" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="170" y="190" text-anchor="middle" fill="#3fb950" font-size="12.5" font-weight="bold">执行器 实例 1（片 0）</text>
  <text x="170" y="212" text-anchor="middle" fill="#e6edf3" font-size="10.5">WHERE id % 3 = 0</text>
  <text x="170" y="228" text-anchor="middle" fill="#8b949e" font-size="10">约 1/3 数据</text>
  <rect x="330" y="165" width="220" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="440" y="190" text-anchor="middle" fill="#3fb950" font-size="12.5" font-weight="bold">执行器 实例 2（片 1）</text>
  <text x="440" y="212" text-anchor="middle" fill="#e6edf3" font-size="10.5">WHERE id % 3 = 1</text>
  <text x="440" y="228" text-anchor="middle" fill="#8b949e" font-size="10">约 1/3 数据</text>
  <rect x="600" y="165" width="220" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="710" y="190" text-anchor="middle" fill="#3fb950" font-size="12.5" font-weight="bold">执行器 实例 3（片 2）</text>
  <text x="710" y="212" text-anchor="middle" fill="#e6edf3" font-size="10.5">WHERE id % 3 = 2</text>
  <text x="710" y="228" text-anchor="middle" fill="#8b949e" font-size="10">约 1/3 数据</text>
  <!-- 底部 -->
  <text x="440" y="260" text-anchor="middle" fill="#3fb950" font-size="11">3 台并行 → 总耗时 ÷ 3；任意一台加进来/出去，任务自动感知（自增实例数自动重分片）</text>
</svg>