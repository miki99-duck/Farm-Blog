<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
        </marker>
      </defs>
      <!-- 控制台/运维 -->
      <rect x="30" y="60" width="170" height="60" rx="8" fill="#1c2129" stroke="#d29922" stroke-width="1.5"/>
      <text x="115" y="88" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">运维 / 控制台</text>
      <text x="115" y="106" text-anchor="middle" fill="#8b949e" font-size="10.5">修改配置（写入）</text>
      <!-- Nacos -->
      <rect x="330" y="50" width="200" height="120" rx="10" fill="rgba(88,166,255,.08)" stroke="#58a6ff" stroke-width="2"/>
      <text x="430" y="80" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Nacos Server</text>
      <text x="430" y="102" text-anchor="middle" fill="#e6edf3" font-size="11.5">配置存储（磁盘 + 缓存）</text>
      <text x="430" y="120" text-anchor="middle" fill="#8b949e" font-size="10.5">变更后记录新 MD5</text>
      <text x="430" y="138" text-anchor="middle" fill="#8b949e" font-size="10.5">版本号 +1（可回滚）</text>
      <text x="430" y="158" text-anchor="middle" fill="#bc8cff" font-size="11">通知等待中的长轮询请求</text>
      <!-- 应用 -->
      <rect x="680" y="40" width="160" height="70" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
      <text x="760" y="66" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">应用实例 A</text>
      <text x="760" y="84" text-anchor="middle" fill="#8b949e" font-size="10.5">本地缓存 + MD5 比对</text>
      <rect x="680" y="130" width="160" height="70" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
      <text x="760" y="156" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">应用实例 B</text>
      <text x="760" y="174" text-anchor="middle" fill="#8b949e" font-size="10.5">本地缓存 + MD5 比对</text>
      <!-- 长轮询 -->
      <line x1="200" y1="90" x2="325" y2="100" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="530" y1="90" x2="675" y2="75" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="530" y1="120" x2="675" y2="150" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
      <text x="560" y="60" fill="#3fb950" font-size="11">① 发起长轮询（带本地 MD5）</text>
      <text x="560" y="140" fill="#bc8cff" font-size="11">② 配置变了 → 立刻返回</text>
      <text x="560" y="158" fill="#8b949e" font-size="11">没变 → 挂起最长 30s 再返回</text>
      <text x="560" y="176" fill="#8b949e" font-size="11">③ 客户端拿新配置 → 刷新 Bean</text>
    </svg>