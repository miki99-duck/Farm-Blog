<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- Trace 边框 -->
  <rect x="20" y="30" width="840" height="180" rx="10" fill="rgba(88,166,255,.04)" stroke="#58a6ff" stroke-dasharray="6 4"/>
  <text x="440" y="55" text-anchor="middle" fill="#58a6ff" font-size="13.5" font-weight="bold">Trace：一次完整请求（traceId = 全局唯一 ID，贯穿所有服务）</text>

  <!-- Span 1 -->
  <rect x="60" y="75" width="760" height="46" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="80" y="97" fill="#3fb950" font-size="12" font-weight="bold">Span 1 网关入口</text>
  <text x="200" y="97" fill="#e6edf3" font-size="11">Gateway: /api/order  ·  spanId=1 · parentSpanId=null</text>
  <text x="560" y="97" fill="#8b949e" font-size="10.5">耗时 150ms · URL/状态码标签</text>

  <!-- Span 2 -->
  <rect x="140" y="135" width="680" height="46" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="160" y="157" fill="#d29922" font-size="12" font-weight="bold">Span 2 服务 A</text>
  <text x="280" y="157" fill="#e6edf3" font-size="11">OrderController.createOrder  ·  spanId=2 · parentSpanId=1</text>
  <text x="580" y="157" fill="#8b949e" font-size="10.5">耗时 120ms</text>

  <!-- Span 3 -->
  <rect x="220" y="195" width="600" height="46" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text x="240" y="217" fill="#bc8cff" font-size="12" font-weight="bold">Span 3 服务 B（远程调用）</text>
  <text x="400" y="217" fill="#e6edf3" font-size="11">StockController.deduct · spanId=3 · parentSpanId=2</text>
  <text x="640" y="217" fill="#8b949e" font-size="10.5">耗时 110ms</text>

  <!-- 关联箭头 -->
  <line x1="440" y1="121" x2="440" y2="130" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="440" y1="181" x2="440" y2="190" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="620" y1="241" x2="620" y2="262" stroke="#f85149" stroke-width="1.5"/>
  <text x="620" y="276" fill="#f85149" font-size="10.5">子 Span：SQL / Redis 操作（自动埋点）</text>

  <!-- 底部说明 -->
  <text x="440" y="230" text-anchor="middle" fill="#8b949e" font-size="10.5">树形结构 = 调用关系；对比各 Span 耗时 → 一眼定位"慢在哪一环"（本例：SQL 子 Span 占 100/120ms）</text>
</svg>
