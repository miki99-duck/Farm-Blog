<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- Ingress -->
  <rect x="30" y="20" width="200" height="60" rx="8" fill="rgba(188,140,255,.07)" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="130" y="46" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="bold">Ingress 入口</text>
  <text x="130" y="66" text-anchor="middle" fill="#8b949e" font-size="9.5">域名/路径 → 对应 Service（7 层）</text>
  <!-- Service -->
  <rect x="330" y="20" width="220" height="60" rx="8" fill="rgba(88,166,255,.08)" stroke="#58a6ff" stroke-width="2"/>
  <text x="440" y="46" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Service（稳定访问入口）</text>
  <text x="440" y="66" text-anchor="middle" fill="#8b949e" font-size="9.5">ClusterIP + DNS：order-service → 选择 Pod 集合</text>
  <!-- 容器组 -->
  <text x="130" y="120" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Deployment：声明期望副本数，自动伸缩/滚动更新</text>
  <text x="130" y="140" text-anchor="middle" fill="#8b949e" font-size="9.5">spec.replicas: 3 → 永远保持 3 个副本，挂一个拉起一个</text>
  <!-- 3 个 Pod -->
  <rect x="330" y="95" width="140" height="130" rx="8" fill="rgba(63,185,80,.06)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="400" y="115" text-anchor="middle" fill="#3fb950" font-size="11.5" font-weight="bold">Pod A</text>
  <rect x="350" y="125" width="100" height="34" rx="5" fill="#161b22" stroke="#8b949e"/>
  <text x="400" y="141" text-anchor="middle" fill="#e6edf3" font-size="9.5">order-service 容器</text>
  <text x="400" y="157" text-anchor="middle" fill="#8b949e" font-size="8.5">IP: 10.0.0.1</text>
  <text x="400" y="180" text-anchor="middle" fill="#8b949e" font-size="9">标签 app=order</text>
  <text x="400" y="196" text-anchor="middle" fill="#8b949e" font-size="9">就绪探针 / 存活探针</text>
  <text x="400" y="215" text-anchor="middle" fill="#8b949e" font-size="9">（可重启/可替换）</text>
  <rect x="490" y="95" width="140" height="130" rx="8" fill="rgba(63,185,80,.06)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="560" y="115" text-anchor="middle" fill="#3fb950" font-size="11.5" font-weight="bold">Pod B</text>
  <rect x="510" y="125" width="100" height="34" rx="5" fill="#161b22" stroke="#8b949e"/>
  <text x="560" y="141" text-anchor="middle" fill="#e6edf3" font-size="9.5">order-service 容器</text>
  <text x="560" y="157" text-anchor="middle" fill="#8b949e" font-size="8.5">IP: 10.0.0.2</text>
  <text x="560" y="196" text-anchor="middle" fill="#8b949e" font-size="9">标签 app=order</text>
  <rect x="650" y="95" width="140" height="130" rx="8" fill="rgba(63,185,80,.06)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="720" y="115" text-anchor="middle" fill="#3fb950" font-size="11.5" font-weight="bold">Pod C</text>
  <rect x="670" y="125" width="100" height="34" rx="5" fill="#161b22" stroke="#8b949e"/>
  <text x="720" y="141" text-anchor="middle" fill="#e6edf3" font-size="9.5">order-service 容器</text>
  <text x="720" y="157" text-anchor="middle" fill="#8b949e" font-size="8.5">IP: 10.0.0.3</text>
  <text x="720" y="196" text-anchor="middle" fill="#8b949e" font-size="9">标签 app=order</text>
  <!-- 箭头 -->
  <line x1="230" y1="50" x2="325" y2="50" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="550" y1="50" x2="550" y2="90" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="80" x2="400" y2="90" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="440" y1="80" x2="560" y2="90" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="440" y1="80" x2="720" y2="90" stroke="#58a6ff" stroke-width="1.5"/>
  <!-- 基础设施 -->
  <rect x="30" y="255" width="820" height="60" rx="8" fill="#161b22" stroke="#8b949e"/>
  <text x="440" y="280" text-anchor="middle" fill="#8b949e" font-size="11">ConfigMap（配置）/ Secret（密钥）/ Namespace（隔离）/ HPA（按 CPU 自动扩缩容）/ 挂载存储（PVC）</text>
  <text x="440" y="302" text-anchor="middle" fill="#8b949e" font-size="10.5">Pod 的 IP 随时变（重启就换）→ Service 提供稳定 DNS，负载均衡到一组 Pod（label selector）</text>
</svg>