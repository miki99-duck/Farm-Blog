<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- 业务 SQL -->
  <rect x="30" y="40" width="200" height="70" rx="8" fill="rgba(63,185,80,.06)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="66" text-anchor="middle" fill="#3fb950" font-size="12.5" font-weight="bold">业务 SQL（逻辑表）</text>
  <text x="130" y="90" text-anchor="middle" fill="#e6edf3" font-size="10.5">SELECT * FROM `t_order`</text>
  <text x="130" y="106" text-anchor="middle" fill="#e6edf3" font-size="10.5">WHERE user_id = 1001</text>
  <!-- 5 个阶段盒子 -->
  <rect x="280" y="20" width="110" height="55" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="335" y="44" text-anchor="middle" fill="#58a6ff" font-size="11.5" font-weight="bold">① SQL 解析</text>
  <text x="335" y="62" text-anchor="middle" fill="#8b949e" font-size="9">语法树，找分片键</text>
  <rect x="280" y="95" width="110" height="55" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="335" y="119" text-anchor="middle" fill="#58a6ff" font-size="11.5" font-weight="bold">② 路由</text>
  <text x="335" y="137" text-anchor="middle" fill="#8b949e" font-size="9">user_id 1001 % 4</text>
  <text x="335" y="151" text-anchor="middle" fill="#8b949e" font-size="9">→ 表 t_order_1</text>
  <rect x="280" y="170" width="110" height="55" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="335" y="194" text-anchor="middle" fill="#58a6ff" font-size="11.5" font-weight="bold">③ SQL 改写</text>
  <text x="335" y="212" text-anchor="middle" fill="#8b949e" font-size="9">t_order → t_order_1</text>
  <rect x="280" y="245" width="110" height="55" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="335" y="269" text-anchor="middle" fill="#58a6ff" font-size="11.5" font-weight="bold">④ 执行</text>
  <text x="335" y="287" text-anchor="middle" fill="#8b949e" font-size="9">去真实库执行</text>
  <!-- 物理表 -->
  <rect x="660" y="40" width="180" height="120" rx="8" fill="rgba(216,150,34,.06)" stroke="#d29922"/>
  <text x="750" y="66" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">物理表（真实库）</text>
  <text x="750" y="90" text-anchor="middle" fill="#e6edf3" font-size="10.5">ds0.t_order_0</text>
  <text x="750" y="108" text-anchor="middle" fill="#e6edf3" font-size="10.5">ds0.t_order_1</text>
  <text x="750" y="126" text-anchor="middle" fill="#e6edf3" font-size="10.5">ds1.t_order_2</text>
  <text x="750" y="144" text-anchor="middle" fill="#e6edf3" font-size="10.5">ds1.t_order_3</text>
  <!-- ⑤ 归并 -->
  <rect x="660" y="195" width="180" height="55" rx="8" fill="rgba(188,140,255,.06)" stroke="#bc8cff"/>
  <text x="750" y="219" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">⑤ 结果归并</text>
  <text x="750" y="237" text-anchor="middle" fill="#8b949e" font-size="9">多片结果合并/排序/聚合</text>
  <!-- 箭头 -->
  <line x1="230" y1="75" x2="275" y2="70" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="335" y1="75" x2="335" y2="90" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="335" y1="150" x2="335" y2="165" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="335" y1="225" x2="335" y2="240" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="390" y1="140" x2="655" y2="100" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="655" y1="222" x2="390" y2="250" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="130" fill="#8b949e" font-size="10">只路由一条：分片键压中 → 高效</text>
  <text x="500" y="280" fill="#8b949e" font-size="10">无分片键查询 → 广播所有片（性能差，尽量避免）</text>
</svg>