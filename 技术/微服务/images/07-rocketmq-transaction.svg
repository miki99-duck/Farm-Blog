<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <text x="100" y="28" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Producer 应用</text>
  <text x="440" y="28" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Broker</text>
  <text x="760" y="28" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">业务本地事务</text>
  <line x1="40" y1="42" x2="840" y2="42" stroke="#30363d" stroke-width="1.5"/>
  <!-- 发送 half -->
  <line x1="120" y1="65" x2="420" y2="65" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <text x="260" y="58" fill="#8b949e" font-size="10.5">① 发送 HALF 消息（半消息，消费者不可见）</text>
  <!-- 本地事务 -->
  <line x1="460" y1="65" x2="740" y2="65" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  <text x="580" y="58" fill="#8b949e" font-size="10.5">② Broker 返回成功</text>
  <line x1="740" y1="85" x2="460" y2="85" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="98" fill="#8b949e" font-size="10.5">③ 执行本地事务（写库）</text>
  <!-- commit -->
  <line x1="120" y1="115" x2="420" y2="115" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="260" y="108" fill="#3fb950" font-size="10.5">④ 事务成功 → 提交（COMMIT）：消息对消费者可见</text>
  <!-- 回查 -->
  <rect x="40" y="140" width="800" height="130" rx="8" fill="rgba(88,166,255,.05)" stroke="#58a6ff" stroke-dasharray="5 3"/>
  <text x="60" y="165" fill="#58a6ff" font-size="12" font-weight="bold">超时/异常情况：Broker 主动回查（check）</text>
  <line x1="460" y1="185" x2="740" y2="185" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <text x="580" y="178" fill="#8b949e" font-size="10.5">⑤ 定时回查：本地事务状态查了吗？</text>
  <line x1="740" y1="205" x2="460" y2="205" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="218" fill="#8b949e" font-size="10.5">⑥ 查库确认：成功/失败/未知</text>
  <line x1="120" y1="235" x2="420" y2="235" stroke="#3fb950" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="260" y="228" fill="#3fb950" font-size="10.5">⑦ 成功 → COMMIT；失败 → ROLLBACK；未知 → 继续等/最终丢弃</text>
  <!-- 消费 -->
  <line x1="440" y1="290" x2="440" y2="320" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>
  <text x="330" y="338" fill="#bc8cff" font-size="11">COMMIT 之后消费者才能看到并消费（保证"先本地事务成功，后消息可见"）</text>
  <text x="330" y="360" fill="#f85149" font-size="11">ROLLBACK 的消息会被删除，消费者永远看不到 —— 不会出现"事务没成功消息却发出去了"</text>
  <text x="330" y="385" fill="#8b949e" font-size="10.5">应用场景：扣余额成功 → 发消息通知；余额不足 → 回滚消息，杜绝假通知</text>
</svg>
