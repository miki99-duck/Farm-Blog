<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- Producer -->
  <rect x="30" y="130" width="150" height="70" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="105" y="160" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">Producer 生产者</text>
  <text x="105" y="182" text-anchor="middle" fill="#8b949e" font-size="10.5">订单服务等，发消息</text>
  <!-- Consumer -->
  <rect x="700" y="130" width="150" height="70" rx="8" fill="#1c2129" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="775" y="160" text-anchor="middle" fill="#bc8cff" font-size="14" font-weight="bold">Consumer 消费者</text>
  <text x="775" y="182" text-anchor="middle" fill="#8b949e" font-size="10.5">库存/通知服务，消费</text>
  <!-- NameServer -->
  <rect x="330" y="20" width="220" height="60" rx="8" fill="rgba(88,166,255,.08)" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="440" y="46" text-anchor="middle" fill="#58a6ff" font-size="13.5" font-weight="bold">NameServer 注册中心</text>
  <text x="440" y="66" text-anchor="middle" fill="#8b949e" font-size="10.5">无状态，只存 Broker 元数据（路由信息）</text>
  <!-- Broker -->
  <rect x="330" y="130" width="220" height="120" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="440" y="158" text-anchor="middle" fill="#d29922" font-size="14" font-weight="bold">Broker 服务器（主）</text>
  <text x="440" y="180" text-anchor="middle" fill="#e6edf3" font-size="11">Topic → 多个 MessageQueue</text>
  <text x="440" y="200" text-anchor="middle" fill="#e6edf3" font-size="11">CommitLog 顺序写 + 索引</text>
  <text x="440" y="220" text-anchor="middle" fill="#8b949e" font-size="10.5">同步刷盘 / 异步刷盘，主从复制</text>
  <text x="440" y="240" text-anchor="middle" fill="#8b949e" font-size="10.5">消费进度（offset）管理</text>
  <!-- 主从关系 -->
  <rect x="330" y="270" width="220" height="40" rx="8" fill="#161b22" stroke="#d29922" stroke-dasharray="4 3"/>
  <text x="440" y="295" text-anchor="middle" fill="#d29922" font-size="12">Broker（从）：主挂后自动接管</text>
  <!-- 箭头 -->
  <line x1="180" y1="165" x2="325" y2="165" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="555" y1="165" x2="695" y2="165" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="80" x2="440" y2="125" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="330" y1="165" x2="250" y2="165" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="250" y1="165" x2="250" y2="110" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="250" y1="110" x2="325" y2="60" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="180" y="100" fill="#8b949e" font-size="10.5">定期拉取路由信息</text>
  <text x="600" y="120" fill="#8b949e" font-size="10.5">消费：主动拉取 + 长轮询</text>
</svg>
