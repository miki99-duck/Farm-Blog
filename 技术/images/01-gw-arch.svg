<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="330" viewBox="0 0 880 330">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
        </marker>
        <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
        </marker>
      </defs>
      <!-- 客户端 -->
      <rect x="20" y="130" width="120" height="56" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="80" y="156" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">客户端</text>
      <text x="80" y="174" text-anchor="middle" fill="#8b949e" font-size="11">App / 浏览器</text>
      <!-- 网关大框 -->
      <rect x="230" y="60" width="360" height="220" rx="10" fill="none" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="410" y="84" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">Spring Cloud Gateway</text>
      <!-- 内部组件 -->
      <rect x="250" y="100" width="150" height="46" rx="6" fill="#161b22" stroke="#8b949e"/>
      <text x="325" y="118" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="bold">GatewayHandlerMapping</text>
      <text x="325" y="134" text-anchor="middle" fill="#8b949e" font-size="10.5">Predicate 匹配路由</text>
      <rect x="420" y="100" width="150" height="46" rx="6" fill="#161b22" stroke="#8b949e"/>
      <text x="495" y="118" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="bold">FilteringWebHandler</text>
      <text x="495" y="134" text-anchor="middle" fill="#8b949e" font-size="10.5">组装过滤器链</text>
      <rect x="250" y="170" width="320" height="86" rx="6" fill="#161b22" stroke="#bc8cff"/>
      <text x="410" y="192" text-anchor="middle" fill="#bc8cff" font-size="12.5" font-weight="bold">过滤器链（pre → 转发 → post）</text>
      <text x="280" y="212" fill="#e6edf3" font-size="11.5">① GlobalFilter order 小者先执行</text>
      <text x="280" y="230" fill="#e6edf3" font-size="11.5">② 内置 GatewayFilter（限流/重写路径…）</text>
      <text x="280" y="248" fill="#e6edf3" font-size="11.5">③ Netty 异步转发到下游</text>
      <!-- 下游服务 -->
      <rect x="700" y="60" width="150" height="44" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
      <text x="775" y="82" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="bold">订单服务</text>
      <text x="775" y="98" text-anchor="middle" fill="#8b949e" font-size="10.5">lb://order-service</text>
      <rect x="700" y="130" width="150" height="44" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
      <text x="775" y="152" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="bold">用户服务</text>
      <text x="775" y="168" text-anchor="middle" fill="#8b949e" font-size="10.5">lb://user-service</text>
      <rect x="700" y="200" width="150" height="44" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
      <text x="775" y="222" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="bold">库存服务</text>
      <text x="775" y="238" text-anchor="middle" fill="#8b949e" font-size="10.5">lb://stock-service</text>
      <!-- 箭头 -->
      <line x1="140" y1="158" x2="225" y2="150" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="400" y1="123" x2="415" y2="123" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="495" y1="146" x2="495" y2="166" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="570" y1="175" x2="695" y2="100" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
      <line x1="570" y1="200" x2="695" y2="160" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
      <line x1="570" y1="225" x2="695" y2="225" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>
      <line x1="775" y1="60" x2="775" y2="52" stroke="#3fb950" stroke-width="1.5"/>
      <line x1="410" y1="52" x2="775" y2="52" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="560" y="44" fill="#3fb950" font-size="11">Nacos 注册中心（lb:// 服务发现）</text>
    </svg>