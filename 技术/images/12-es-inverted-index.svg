<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- 文档 -->
  <text x="140" y="35" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">原始日志文档</text>
  <rect x="40" y="50" width="200" height="120" rx="8" fill="#161b22" stroke="#8b949e"/>
  <text x="140" y="75" text-anchor="middle" fill="#e6edf3" font-size="10.5">Doc 1: "下单失败" userId=1001</text>
  <text x="140" y="95" text-anchor="middle" fill="#e6edf3" font-size="10.5">Doc 2: "支付超时" orderId=888</text>
  <text x="140" y="115" text-anchor="middle" fill="#e6edf3" font-size="10.5">Doc 3: "下单成功" userId=1002</text>
  <text x="140" y="135" text-anchor="middle" fill="#e6edf3" font-size="10.5">Doc 4: "支付成功" orderId=999</text>
  <text x="140" y="155" text-anchor="middle" fill="#8b949e" font-size="9.5">（现在要搜"所有含 下单 的日志）</text>
  <!-- 箭头 -->
  <line x1="260" y1="110" x2="340" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <!-- 倒排索引 -->
  <text x="560" y="35" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">倒排索引（分词后建立）</text>
  <rect x="300" y="50" width="540" height="160" rx="8" fill="rgba(88,166,255,.05)" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="320" y="80" fill="#d29922" font-size="11.5" font-weight="bold">词项 "下单"</text>
  <rect x="380" y="68" width="130" height="18" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="445" y="81" text-anchor="middle" fill="#3fb950" font-size="10">→ [Doc 1, Doc 3]</text>
  <text x="320" y="112" fill="#d29922" font-size="11.5" font-weight="bold">词项 "支付"</text>
  <rect x="380" y="100" width="130" height="18" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="445" y="113" text-anchor="middle" fill="#3fb950" font-size="10">→ [Doc 2, Doc 4]</text>
  <text x="320" y="144" fill="#d29922" font-size="11.5" font-weight="bold">词项 "1001"</text>
  <rect x="380" y="132" width="130" height="18" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="445" y="145" text-anchor="middle" fill="#3fb950" font-size="10">→ [Doc 1]</text>
  <text x="320" y="176" fill="#d29922" font-size="11.5" font-weight="bold">词项 "888"</text>
  <rect x="380" y="164" width="130" height="18" rx="4" fill="#161b22" stroke="#3fb950"/>
  <text x="445" y="177" text-anchor="middle" fill="#3fb950" font-size="10">→ [Doc 2]</text>
  <!-- 查询 -->
  <text x="700" y="80" fill="#8b949e" font-size="10.5">查询 "下单"：</text>
  <text x="700" y="100" fill="#3fb950" font-size="10.5">直接查倒排表 →</text>
  <text x="700" y="118" fill="#3fb950" font-size="10.5">O(1) 命中 [Doc1, Doc3]</text>
  <text x="700" y="150" fill="#8b949e" font-size="10.5">不用遍历全部文档</text>
  <!-- 底部 -->
  <text x="440" y="235" text-anchor="middle" fill="#8b949e" font-size="11">为什么不慢：全文检索不用"一条条扫日志"，而是查"词 → 文档"的映射表，这就是 ES/Elasticsearch 秒级检索的底层原理</text>
</svg>