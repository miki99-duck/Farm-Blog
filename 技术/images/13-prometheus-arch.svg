<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <!-- 被监控对象 -->
  <rect x="30" y="30" width="190" height="90" rx="8" fill="rgba(63,185,80,.06)" stroke="#3fb950" stroke-width="1.5"/>
  <text x="125" y="55" text-anchor="middle" fill="#3fb950" font-size="12.5" font-weight="bold">Spring Boot 应用</text>
  <text x="125" y="75" text-anchor="middle" fill="#e6edf3" font-size="10">actuator + micrometer</text>
  <text x="125" y="92" text-anchor="middle" fill="#8b949e" font-size="9.5">/actuator/prometheus</text>
  <text x="125" y="108" text-anchor="middle" fill="#8b949e" font-size="9.5">JVM/HTTP/业务指标</text>

  <rect x="30" y="140" width="190" height="70" rx="8" fill="rgba(216,150,34,.06)" stroke="#d29922" stroke-width="1.5"/>
  <text x="125" y="165" text-anchor="middle" fill="#d29922" font-size="12.5" font-weight="bold">数据库 / Redis / 系统</text>
  <text x="125" y="185" text-anchor="middle" fill="#8b949e" font-size="9.5">mysqld_exporter / redis_exporter</text>
  <text x="125" y="200" text-anchor="middle" fill="#8b949e" font-size="9.5">node_exporter（CPU/内存）</text>

  <!-- Prometheus -->
  <rect x="350" y="50" width="220" height="200" rx="10" fill="rgba(88,166,255,.07)" stroke="#58a6ff" stroke-width="2"/>
  <text x="460" y="78" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">Prometheus Server</text>
  <text x="460" y="102" text-anchor="middle" fill="#e6edf3" font-size="11">Pull 定时抓取（默认 15s）</text>
  <text x="460" y="122" text-anchor="middle" fill="#e6edf3" font-size="11">TSDB 时序存储</text>
  <text x="460" y="142" text-anchor="middle" fill="#8b949e" font-size="9.5">metrics + 标签（service、instance）</text>
  <text x="460" y="165" text-anchor="middle" fill="#e6edf3" font-size="11">PromQL 查询语言</text>
  <text x="460" y="185" text-anchor="middle" fill="#e6edf3" font-size="11">规则评估（阈值）</text>
  <text x="460" y="205" text-anchor="middle" fill="#8b949e" font-size="9.5">job/service-discovery 发现目标</text>
  <text x="460" y="230" text-anchor="middle" fill="#8b949e" font-size="9.5">配置：prometheus.yml</text>

  <!-- AlertManager -->
  <rect x="650" y="50" width="200" height="80" rx="10" fill="rgba(248,81,73,.06)" stroke="#f85149" stroke-width="1.5"/>
  <text x="750" y="78" text-anchor="middle" fill="#f85149" font-size="13.5" font-weight="bold">AlertManager</text>
  <text x="750" y="100" text-anchor="middle" fill="#e6edf3" font-size="10.5">接收告警、去重/分组/静默</text>
  <text x="750" y="118" text-anchor="middle" fill="#e6edf3" font-size="10.5">推送钉钉 / 邮件 / Webhook</text>

  <!-- Grafana -->
  <rect x="650" y="160" width="200" height="80" rx="10" fill="rgba(188,140,255,.06)" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="750" y="188" text-anchor="middle" fill="#bc8cff" font-size="13.5" font-weight="bold">Grafana</text>
  <text x="750" y="208" text-anchor="middle" fill="#e6edf3" font-size="10.5">可视化看板（数据源=Prometheus）</text>
  <text x="750" y="226" text-anchor="middle" fill="#e6edf3" font-size="10.5">大盘：JVM/接口/首页黄金指标</text>

  <!-- 箭头 -->
  <line x1="220" y1="75" x2="345" y2="75" stroke="#3fb950" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="220" y1="175" x2="345" y2="125" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="90" x2="645" y2="90" stroke="#f85149" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="200" x2="645" y2="200" stroke="#bc8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 底部 -->
  <text x="440" y="290" text-anchor="middle" fill="#8b949e" font-size="11">黄金四指标（RED 方法）：Rate 请求量 · Errors 错误率 · Duration 耗时 · Saturation 饱和度（CPU/连接池）</text>
  <text x="440" y="318" text-anchor="middle" fill="#3fb950" font-size="11">链路：日志（ELK，事后细节）→ 指标（Prometheus，实时状态）→ 链路（SkyWalking，单请求路径）→ 三支柱互补</text>
</svg>