<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="330" viewBox="0 0 880 330">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
        </marker>
      </defs>
      <text x="440" y="24" text-anchor="middle" fill="#8b949e" font-size="12">启动时：@EnableFeignClients 扫描 → FeignClientsRegistrar 注册 → FeignClientFactoryBean 为每个 @FeignClient 接口生成 JDK 动态代理</text>

      <rect x="20" y="50" width="150" height="56" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="95" y="76" text-anchor="middle" fill="#e6edf3" font-size="12.5" font-weight="bold">业务代码调用</text>
      <text x="95" y="94" text-anchor="middle" fill="#8b949e" font-size="10.5">orderClient.getOrder(1L)</text>

      <rect x="210" y="50" width="170" height="56" rx="8" fill="rgba(188,140,255,.08)" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="295" y="76" text-anchor="middle" fill="#bc8cff" font-size="12.5" font-weight="bold">JDK 动态代理</text>
      <text x="295" y="94" text-anchor="middle" fill="#8b949e" font-size="10.5">InvocationHandler 拦截</text>

      <rect x="420" y="50" width="170" height="56" rx="8" fill="#1c2129" stroke="#d29922" stroke-width="1.5"/>
      <text x="505" y="76" text-anchor="middle" fill="#d29922" font-size="12.5" font-weight="bold">RequestTemplate</text>
      <text x="505" y="94" text-anchor="middle" fill="#8b949e" font-size="10.5">方法注解 → HTTP 请求模型</text>

      <rect x="210" y="140" width="380" height="120" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
      <text x="400" y="164" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">执行链路（SynchronousMethodHandler）</text>
      <text x="240" y="188" fill="#e6edf3" font-size="11.5">① 拦截器 RequestInterceptor（透传 token）</text>
      <text x="240" y="208" fill="#e6edf3" font-size="11.5">② 编码器 Encoder（对象 → 请求体 JSON）</text>
      <text x="240" y="228" fill="#e6edf3" font-size="11.5">③ Client 发送：服务名 → LoadBalancer 选实例 → 发 HTTP</text>
      <text x="240" y="248" fill="#e6edf3" font-size="11.5">④ 解码器 Decoder（响应 JSON → 对象）</text>

      <rect x="660" y="140" width="190" height="66" rx="8" fill="rgba(88,166,255,.08)" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="755" y="164" text-anchor="middle" fill="#58a6ff" font-size="12.5" font-weight="bold">Nacos + LoadBalancer</text>
      <text x="755" y="184" text-anchor="middle" fill="#8b949e" font-size="10.5">order-service → 实例列表</text>
      <text x="755" y="200" text-anchor="middle" fill="#8b949e" font-size="10.5">轮询/随机选一个</text>

      <rect x="660" y="230" width="190" height="56" rx="8" fill="#1c2129" stroke="#d29922" stroke-width="1.5"/>
      <text x="755" y="256" text-anchor="middle" fill="#d29922" font-size="12.5" font-weight="bold">order-service 实例</text>
      <text x="755" y="274" text-anchor="middle" fill="#8b949e" font-size="10.5">192.168.1.10:8081/order/1</text>

      <line x1="170" y1="78" x2="205" y2="78" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="380" y1="78" x2="415" y2="78" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="505" y1="106" x2="505" y2="135" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="595" y1="170" x2="655" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="755" y1="206" x2="755" y2="225" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
      <line x1="400" y1="260" x2="400" y2="290" stroke="#3fb950" stroke-width="2"/>
      <line x1="400" y1="290" x2="755" y2="290" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3"/>
      <line x1="755" y1="290" x2="755" y2="286" stroke="#3fb950" stroke-width="1.5"/>
      <text x="560" y="284" fill="#3fb950" font-size="10.5">响应原路返回（解码器 → 代理 → 业务代码）</text>
    </svg>