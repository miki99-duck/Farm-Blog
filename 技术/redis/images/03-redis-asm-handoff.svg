<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <rect x="0" y="0" width="880" height="460" fill="#0d1117"/>
  <defs>
    <marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bc8cff"/>
    </marker>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0883e"/>
    </marker>
  </defs>
  <!-- 标题 -->
  <text x="22" y="36" fill="#e6edf3" font-size="15" font-weight="bold">原子槽迁移（ASM）：把「长时间不可用」换成「可度量的短写停顿」</text>
  <text x="22" y="58" fill="#8b949e" font-size="11.5">CLUSTER MIGRATION 自 8.4.0 起；8.10 起 redis-cli --cluster reshard/rebalance 也走它</text>
  <!-- 两端 -->
  <rect x="30" y="150" width="210" height="130" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="135.0" y="202.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">源节点</text>
  <text x="135.0" y="214.875" fill="#8b949e" font-size="10.5" text-anchor="middle">持有槽与数据</text>
  <text x="135.0" y="229.375" fill="#8b949e" font-size="10.5" text-anchor="middle">迁移期间暂停写在 handoff 阶段</text>
  <rect x="640" y="150" width="210" height="130" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="745.0" y="202.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">目标节点</text>
  <text x="745.0" y="214.875" fill="#8b949e" font-size="10.5" text-anchor="middle">执行 CLUSTER MIGRATION IMPORT</text>
  <text x="745.0" y="229.375" fill="#8b949e" font-size="10.5" text-anchor="middle">返回 task ID，可查询 STATUS</text>
  <!-- 两阶段 -->
  <rect x="300" y="96" width="280" height="62" rx="8" fill="#1c2129" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="440.0" y="130.36" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">① 快照 + 复制流追赶</text>
  <text x="300" y="180" fill="#bc8cff" font-size="10.5">阈值：cluster-slot-migration-handoff-max-lag-bytes = 1mb</text>
  <rect x="300" y="210" width="280" height="62" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="440.0" y="244.36" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">② 短暂写停顿 handoff</text>
  <text x="300" y="294" fill="#f0883e" font-size="10.5">上限：cluster-slot-migration-write-pause-timeout = 10000 ms</text>
  <line x1="244" y1="200" x2="296" y2="150" stroke="#bc8cff" stroke-width="2" marker-end="url(#ar0)"/>
  <line x1="584" y1="150" x2="636" y2="200" stroke="#bc8cff" stroke-width="2" marker-end="url(#ar0)"/>
  <line x1="244" y1="240" x2="296" y2="240" stroke="#f0883e" stroke-width="2" marker-end="url(#ar1)"/>
  <line x1="584" y1="240" x2="636" y2="240" stroke="#f0883e" stroke-width="2" marker-end="url(#ar1)"/>
  <text x="440" y="82" fill="#8b949e" font-size="10.5" text-anchor="middle">剩余复制流小于 1mb → 暂停写入并移交所有权；可用 write_pause_ms 度量代价</text>
  <!-- 风险 -->
  <rect x="30" y="318" width="820" height="58" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="44" y="342" fill="#f85149" font-size="11">注意：超时设太小会丢写：源节点恢复写入、而目标随后仍接管所有权 → 这些写入可能丢失。</text>
  <text x="44" y="364" fill="#f85149" font-size="11">注意：CANCEL 只作用于本端：在源端取消不会停止目标端的迁移，运维脚本必须两端都处理。</text>
  <!-- 迁移期间的可见性 -->
  <text x="30" y="404" fill="#e6edf3" font-size="10.5">· KEY / SCAN / RANDOMKEY / CLUSTER GETKEYSINSLOT / DBSIZE / CLUSTER COUNTKEYSINSLOT 会过滤掉未拥有槽的 key；</text>
  <text x="30" y="424" fill="#e6edf3" font-size="10.5">  而 INFO KEYSPACE 仍反映真实 key 数（含正在导入的）—— 两个数字不一致是设计，不是 bug。</text>
  <text x="30" y="446" fill="#f0883e" font-size="10.5">· ASM 期间 FT.SEARCH / FT.AGGREGATE / FT.CURSOR / FT.HYBRID / TS.* 的结果可能不完整或重复 → 槽迁移要避开检索业务高峰。</text>
</svg>
