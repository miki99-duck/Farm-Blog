<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
  <rect x="0" y="0" width="880" height="470" fill="#0d1117"/>
  <!-- 标题 -->
  <text x="22" y="36" fill="#e6edf3" font-size="15" font-weight="bold">compact hash：把「字段名」从每个 key 里抽出来共享</text>
  <text x="22" y="58" fill="#8b949e" font-size="11.5">8.10 的 hash templates：同一组字段名只存一次，每个 key 只存值 + 一个小引用</text>
  <!-- 普通 hash -->
  <rect x="22" y="78" width="400" height="240" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="102" fill="#f0883e" font-size="12" font-weight="bold">普通 hash：每个 key 各存一份字段名</text>
  <rect x="34" y="116" width="150" height="46" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="109.0" y="133.47" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">user:1</text>
  <text x="109.0" y="145.795" fill="#8b949e" font-size="9.5" text-anchor="middle">hashtable 编码</text>
  <rect x="200" y="122" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="231.0" y="141.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">name</text>
  <rect x="270" y="122" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="301.0" y="141.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">email</text>
  <rect x="340" y="122" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="371.0" y="141.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">age</text>
  <rect x="34" y="174" width="150" height="46" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="109.0" y="191.47" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">user:2</text>
  <text x="109.0" y="203.795" fill="#8b949e" font-size="9.5" text-anchor="middle">hashtable 编码</text>
  <rect x="200" y="180" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="231.0" y="199.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">name</text>
  <rect x="270" y="180" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="301.0" y="199.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">email</text>
  <rect x="340" y="180" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="371.0" y="199.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">age</text>
  <rect x="34" y="232" width="150" height="46" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="109.0" y="249.47" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">user:3</text>
  <text x="109.0" y="261.79499999999996" fill="#8b949e" font-size="9.5" text-anchor="middle">hashtable 编码</text>
  <rect x="200" y="238" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="231.0" y="257.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">name</text>
  <rect x="270" y="238" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="301.0" y="257.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">email</text>
  <rect x="340" y="238" width="62" height="34" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="371.0" y="257.8" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">age</text>
  <text x="34" y="306" fill="#8b949e" font-size="10.5">字段名被重复存储 3 次 → 字段名越长、key 越多，浪费越大</text>
  <!-- compact hash -->
  <rect x="458" y="78" width="400" height="240" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="470" y="102" fill="#3fb950" font-size="12" font-weight="bold">compact hash：共享字段名集合 + 引用</text>
  <rect x="470" y="118" width="376" height="48" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="658.0" y="136.47" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">字段名集合 u：name | email | age</text>
  <text x="658.0" y="148.795" fill="#8b949e" font-size="9.5" text-anchor="middle">只存一份（随 key 持久化）</text>
  <rect x="470" y="182" width="150" height="34" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="545.0" y="201.94" fill="#e6edf3" font-size="10.5" font-weight="bold" text-anchor="middle">user:1</text>
  <text x="632" y="204" fill="#e6edf3" font-size="10">值 30 字节 + 指向 u 的小引用</text>
  <line x1="620" y1="199" x2="842" y2="199" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="470" y="224" width="150" height="34" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="545.0" y="243.94" fill="#e6edf3" font-size="10.5" font-weight="bold" text-anchor="middle">user:2</text>
  <text x="632" y="246" fill="#e6edf3" font-size="10">值 30 字节 + 指向 u 的小引用</text>
  <line x1="620" y1="241" x2="842" y2="241" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="470" y="266" width="150" height="34" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="545.0" y="285.94" fill="#e6edf3" font-size="10.5" font-weight="bold" text-anchor="middle">user:3</text>
  <text x="632" y="288" fill="#e6edf3" font-size="10">值 30 字节 + 指向 u 的小引用</text>
  <line x1="620" y1="283" x2="842" y2="283" stroke="#30363d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="470" y="306" fill="#8b949e" font-size="10.5">官方数字：共享 schema 的 key 内存最多 −50%；HIMPORT 批量导入吞吐 2×</text>
  <!-- 代价与限制 -->
  <text x="22" y="348" fill="#f85149" font-size="11">① 单向不可逆：一旦转成 compact hash 就永不退回普通 hash（只能重建数据）。</text>
  <text x="22" y="370" fill="#f85149" font-size="11">② 字段名每个 key 都不同时，元数据开销可能比普通 hash 更费内存 —— 要成百上千 key 共享才划算。</text>
  <text x="22" y="392" fill="#8b949e" font-size="11">③ 超大 hash 在复制与 slot 迁移时按整块 blob 传输，可能把省下的内存用带宽还回去。</text>
  <text x="22" y="414" fill="#8b949e" font-size="11">④ 使用字段过期（hash field TTL）的 hash 不会被转换；安全阀：1000 个集合中过半未达标就中途停止。</text>
  <text x="22" y="436" fill="#8b949e" font-size="10.5">⑤ 配置：hash-min/max-template-entries（默认 0=关闭，可运行时改，惰性生效）；RDB 加载期三件套只对无 compact hash 的 RDB 生效。</text>
</svg>
