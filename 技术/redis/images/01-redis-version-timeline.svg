  <rect x="588" y="122" width="130" height="210" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="653.0" y="145" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">8.8</text>
  <text x="653.0" y="159.25" fill="#8b949e" font-size="10.5" text-anchor="middle">2026-05-25</text>
  <text x="597" y="178" fill="#e6edf3" font-size="9.5">· Array 新类型</text>
  <text x="597" y="208" fill="#e6edf3" font-size="9.5">· INCREX 限流</text>
  <text x="597" y="238" fill="#e6edf3" font-size="9.5">· XNACK 上线</text>
