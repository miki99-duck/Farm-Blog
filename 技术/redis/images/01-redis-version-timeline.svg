  <text x="22" y="36" fill="#e6edf3" font-size="15" font-weight="bold">Redis 8.x 时间线：8.0 → 8.10.2</text>
  <text x="22" y="58" fill="#8b949e" font-size="11.5">偶数 minor、约半年一版；当前最新是 8.10.2（2026-09-17，安全版）</text>
  <!-- 主时间轴 -->
  <line x1="36" y1="100" x2="848" y2="100" stroke="#30363d" stroke-width="2"/>
  <rect x="24" y="122" width="130" height="210" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
