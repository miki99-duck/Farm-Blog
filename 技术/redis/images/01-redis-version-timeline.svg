  <circle cx="653" cy="100" r="5" fill="#58a6ff"/>
  <line x1="653" y1="100" x2="653" y2="116" stroke="#30363d" stroke-width="1.5"/>
  <rect x="729" y="122" width="130" height="210" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="794.0" y="145" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">8.10</text>
