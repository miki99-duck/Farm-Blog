  <!-- 当前最新 -->
  <rect x="30" y="376" width="300" height="66" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="180.0" y="403.67" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">8.10.2</text>
  <text x="180.0" y="417.37" fill="#8b949e" font-size="10.5" text-anchor="middle">2026-09-17 标注 SECURITY</text>
  <text x="340" y="396" fill="#8b949e" font-size="10.5">· cluster-bus-port-protected-mode（默认 no）：未启用 tls-cluster 时</text>
  <text x="340" y="414" fill="#8b949e" font-size="10.5">  cluster bus 没有认证；同批修复 TLS CN 内嵌 NUL 的身份绕过等</text>
  <text x="30" y="458" fill="#f0883e" font-size="10.5">许可：8.0 起 RSALv2 / SSPLv1 / AGPLv3 三选一（不是只有 AGPLv3）；7.2 及更早仍是 BSD-3-Clause。</text>
