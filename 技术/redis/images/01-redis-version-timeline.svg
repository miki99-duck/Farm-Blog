  <text x="315" y="208" fill="#e6edf3" font-size="9.5">· FT.HYBRID</text>
  <text x="315" y="238" fill="#e6edf3" font-size="9.5">· XREADGROUP CLAIM</text>
  <text x="315" y="268" fill="#e6edf3" font-size="9.5">· I/O 吞吐 &gt;30%</text>
  <circle cx="371" cy="100" r="5" fill="#58a6ff"/>
