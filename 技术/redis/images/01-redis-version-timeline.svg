  <rect x="447" y="122" width="130" height="210" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="512.0" y="145" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">8.6</text>
