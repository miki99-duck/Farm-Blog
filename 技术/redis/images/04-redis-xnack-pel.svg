<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460">
  <rect x="0" y="0" width="880" height="460" fill="#0d1117"/>
  <defs>
    <marker id="ar0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <!-- 标题 -->
  <text x="22" y="36" fill="#e6edf3" font-size="15" font-weight="bold">XNACK 之后 PEL 的排序约定：为什么「失败要能被优先重试」</text>
  <text x="22" y="58" fill="#8b949e" font-size="11.5">PEL 头部专门留给 NACK 消息，其后才是既未 ACK 也未 NACK 的 pending</text>
  <!-- 三种模式 -->
  <rect x="30" y="84" width="270" height="78" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="165.0" y="111.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">SILENT</text>
  <text x="165.0" y="123.875" fill="#8b949e" font-size="9.5" text-anchor="middle">投递计数 −1</text>
  <text x="165.0" y="137.375" fill="#8b949e" font-size="9.5" text-anchor="middle">撤销这次投递：消费者内部故障、优雅停机</text>
  <line x1="165" y1="164" x2="165" y2="196" stroke="#3fb950" stroke-width="2" marker-end="url(#ar0)"/>
  <rect x="315" y="84" width="270" height="78" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="450.0" y="111.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">FAIL</text>
  <text x="450.0" y="123.875" fill="#8b949e" font-size="9.5" text-anchor="middle">投递计数不变</text>
  <text x="450.0" y="137.375" fill="#8b949e" font-size="9.5" text-anchor="middle">可能消息问题也可能消费者问题，让别家再试</text>
  <line x1="450" y1="164" x2="450" y2="196" stroke="#58a6ff" stroke-width="2" marker-end="url(#ar1)"/>
  <rect x="600" y="84" width="270" height="78" rx="8" fill="#1c2129" stroke="#f85149" stroke-width="1.5"/>
  <text x="735.0" y="111.0" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">FATAL</text>
  <text x="735.0" y="123.875" fill="#8b949e" font-size="9.5" text-anchor="middle">置为 LLONG_MAX</text>
  <text x="735.0" y="137.375" fill="#8b949e" font-size="9.5" text-anchor="middle">毒消息：标记永久失败，便于路由死信队列</text>
  <line x1="735" y1="164" x2="735" y2="196" stroke="#f85149" stroke-width="2" marker-end="url(#ar3)"/>
  <!-- PEL 结构 -->
  <rect x="30" y="200" width="820" height="96" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="40" y="210" width="300" height="76" rx="6" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="190" y="240" fill="#f0883e" font-size="12" font-weight="bold" text-anchor="middle">NACKed portion（FIFO）</text>
  <text x="190" y="262" fill="#8b949e" font-size="10" text-anchor="middle">last consumer 置空 · last delivery 置 0</text>
  <rect x="350" y="210" width="490" height="76" rx="6" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="595" y="240" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">pending（未 ACK 也未 NACK，保持原顺序）</text>
  <text x="595" y="262" fill="#8b949e" font-size="10" text-anchor="middle">NACK 消息永远优先于它们</text>
  <!-- 投递顺序 -->
  <text x="30" y="326" fill="#e6edf3" font-size="11.5" font-weight="bold">XREADGROUP ... CLAIM min-idle-time 的投递顺序：</text>
  <rect x="30" y="340" width="240" height="46" rx="8" fill="#1c2129" stroke="#f0883e" stroke-width="1.5"/>
  <text x="150.0" y="357.47" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">① NACKed</text>
  <text x="150.0" y="369.795" fill="#8b949e" font-size="9.5" text-anchor="middle">无视 min-idle-time 立即重投</text>
  <line x1="274" y1="363" x2="300" y2="363" stroke="#8b949e" stroke-width="2" marker-end="url(#ar2)"/>
  <rect x="304" y="340" width="260" height="46" rx="8" fill="#1c2129" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="434.0" y="357.47" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">② pending ≥ min-idle</text>
  <text x="434.0" y="369.795" fill="#8b949e" font-size="9.5" text-anchor="middle">空闲够久的才抢</text>
  <line x1="568" y1="363" x2="594" y2="363" stroke="#8b949e" stroke-width="2" marker-end="url(#ar2)"/>
  <rect x="598" y="340" width="252" height="46" rx="8" fill="#1c2129" stroke="#3fb950" stroke-width="1.5"/>
  <text x="724.0" y="357.47" fill="#e6edf3" font-size="11.5" font-weight="bold" text-anchor="middle">③ 从未投递</text>
  <text x="724.0" y="369.795" fill="#8b949e" font-size="9.5" text-anchor="middle">不带 CLAIM 时只返回这一类</text>
  <!-- 注意 -->
  <text x="30" y="414" fill="#8b949e" font-size="10.5">· RETRYCOUNT / FORCE 是内部参数；FORCE 会为「不在 PEL 但存在于流里」的 ID 新建 unowned PEL 条目。</text>
  <text x="30" y="436" fill="#8b949e" font-size="10.5">· XNACK 在 Redis Software / Cloud 均不支持（Open Source 专属）；返回成功释放的消息数，不在 PEL 中的 ID 不计入。</text>
</svg>
